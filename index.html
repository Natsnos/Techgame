s required for any string with digits","So backslashes reach the regex engine unchanged"],"a":3,"e":"In a normal string Python would process backslash escapes first. A raw string leaves them alone."},{"t":"mc","q":"With <code>m = re.search(r\"(\\w+)@(\\w+)\\.com\", \"mail bo@acme.com\")<\/code>, what is <code>m.group(2)<\/code>?","o":["<code>'acme'<\/code>","<code>'bo'<\/code>","<code>'bo@acme.com'<\/code>","<code>'com'<\/code>"],"a":0,"e":"Groups are numbered by their opening bracket. Group 1 is the name before the @ and group 2 is the domain word."}],"py-1-5":[{"t":"mc","q":"What does <code>sorted([\"bb\", \"a\", \"ccc\"], key=len)<\/code> return?","o":["<code>['bb', 'a', 'ccc']<\/code>","<code>['a', 'bb', 'ccc']<\/code>","<code>['ccc', 'bb', 'a']<\/code>","<code>['a', 'ccc', 'bb']<\/code>"],"a":1,"e":"With <code>key=len<\/code>, items are ordered by their length: 1, 2 and 3 characters."},{"t":"ty","q":"What does <code>list(filter(lambda x: x % 2 == 0, [1, 2, 3, 4]))<\/code> return? Type the list.","a":["[2,4]"],"e":"<code>filter<\/code> keeps items for which the function is true, here the even numbers."},{"t":"mc","q":"<code>parcels = [{\"kg\": 5}, {\"kg\": 25}]<\/code>. What is <code>all(p[\"kg\"] &lt; 30 for p in parcels)<\/code>?","o":["<code>False<\/code>","<code>25<\/code>","<code>True<\/code>","<code>[True, True]<\/code>"],"a":2,"e":"Both weights are under 30, so every test is true and <code>all<\/code> returns True."},{"t":"mc","q":"With <code>parcels = [{\"id\": 1, \"kg\": 5}, {\"id\": 2, \"kg\": 2}]<\/code>, what does <code>max(parcels, key=lambda p: p[\"kg\"])<\/code> return?","o":["<code>5<\/code>","<code>{\"id\": 2, \"kg\": 2}<\/code>","<code>1<\/code>","<code>{\"id\": 1, \"kg\": 5}<\/code>"],"a":3,"e":"<code>key<\/code> only decides the comparison. <code>max<\/code> still returns the whole item, not the weight."},{"t":"mc","q":"<code>nums = [3, 1, 2]<\/code>, then <code>sorted(nums)<\/code> is called and the result is ignored. What is <code>nums<\/code> afterwards?","o":["<code>[3, 1, 2]<\/code>","<code>[1, 2, 3]<\/code>","<code>[3, 2, 1]<\/code>","<code>None<\/code>"],"a":0,"e":"<code>sorted<\/code> returns a new list and leaves the original alone. <code>nums.sort()<\/code> is the in-place version."}],"py-1-6":[{"t":"mc","q":"Which error does <code>int(\"abc\")<\/code> raise?","o":["TypeError","NameError","ValueError","KeyError"],"a":2,"e":"The argument is the right type (a string) but its content cannot be converted, which is a ValueError."},{"t":"mc","q":"Which error does <code>\"5\" + 3<\/code> raise?","o":["ValueError","SyntaxError","NameError","TypeError"],"a":3,"e":"Adding a string and an int mixes the wrong kinds of value. Convert one of them first."},{"t":"ty","q":"Which error does <code>\"abc\".append(\"d\")<\/code> raise? Type the error name.","a":["AttributeError"],"e":"Strings have no <code>append<\/code> method, so Python raises AttributeError."},{"t":"mc","q":"A traceback ends with <code>KeyError: 'qty'<\/code> and points at line 12 of <code>report.py<\/code>. What is the best first move?","o":["Wrap the whole script in <code>try/except: pass<\/code>","Inspect line 12 and the dictionary it reads to see why <code>'qty'<\/code> is missing","Rerun it until it works","Rewrite the function from scratch"],"a":1,"e":"The traceback already names the error and location. Check the evidence before changing code, and never silence errors you do not understand."},{"t":"mc","q":"What does a <code>breakpoint()<\/code> call in your code do?","o":["Opens the debugger at that line","Stops the program permanently","Prints the traceback","Skips the next line"],"a":0,"e":"It starts pdb so you can inspect variables and step through code."}],"py-2-0":[{"t":"mc","q":"A class has <code>@property def heavy(self): return self.kg &gt; 20<\/code> and <code>s = Shipment(\"A\", 25)<\/code>. How do you read the value?","o":["<code>s.heavy()<\/code>","<code>Shipment.heavy<\/code>","<code>s.heavy<\/code> (no parentheses)","<code>s.heavy(self)<\/code>"],"a":2,"e":"A property is accessed like an attribute. Calling it with parentheses would try to call the returned True."},{"t":"mc","q":"A method is defined as <code>def m():<\/code> without <code>self<\/code> and called as <code>obj.m()<\/code>. What happens?","o":["It works normally","It returns <code>None<\/code>","It becomes a class variable","TypeError, because the instance is passed in automatically"],"a":3,"e":"Python passes the instance as the first argument, but the method accepts none. That raises TypeError."},{"t":"ty","q":"Type the name of the special method that sets up each new object.","a":["__init__"],"e":"<code>__init__<\/code> runs right after the object is created and is where attributes are set."},{"t":"mc","q":"<code>Express(Shipment)<\/code> defines its own <code>__init__<\/code> that never calls <code>super().__init__()<\/code>. What happens when you read <code>e.id<\/code>?","o":["It returns <code>None<\/code>","AttributeError, because the parent never set it","It returns the parent's default","It works because of inheritance"],"a":1,"e":"Inheritance shares methods, but attributes are only set when code assigns them. Call <code>super().__init__(...)<\/code> to run the parent setup."},{"t":"mc","q":"Two plain-class objects are created with identical data, <code>Shipment(\"A\", 5)<\/code> twice. With no <code>__eq__<\/code> defined, what is the result of comparing them with <code>==<\/code>?","o":["<code>False<\/code>","<code>True<\/code>","TypeError","<code>None<\/code>"],"a":0,"e":"The default equality compares identity, and these are two different objects. Define <code>__eq__<\/code> or use <code>@dataclass<\/code> to compare by value."}],"py-2-1":[{"t":"mc","q":"<code>g = (n * n for n in range(4))<\/code>. After <code>next(g)<\/code> is called twice, what does a third <code>next(g)<\/code> return?","o":["1","9","4","0"],"a":2,"e":"The values come lazily: 0, 1, 4, 9. The third call yields 4."},{"t":"ty","q":"<code>g = (x for x in range(3))<\/code>, then <code>list(g)<\/code> runs once. What does a second <code>list(g)<\/code> give? Type the result.","a":["[]"],"e":"A generator is used up once it has produced everything. It cannot be restarted."},{"t":"mc","q":"Why use <code>functools.wraps<\/code> inside a decorator?","o":["It makes the function run faster","It keeps the original function's name and docstring","It lets the decorator take arguments","It prevents the wrapped function from running twice"],"a":1,"e":"Without it, the decorated function reports the wrapper's name and loses its docstring, which confuses debugging and tools."},{"t":"mc","q":"A decorator defines an inner function called <code>wrapper<\/code> and does not use <code>wraps<\/code>. What is <code>h.__name__<\/code> for the decorated <code>h<\/code>?","o":["<code>'wrapper'<\/code>","<code>'h'<\/code>","<code>'__main__'<\/code>","<code>None<\/code>"],"a":0,"e":"<code>h<\/code> now refers to the wrapper, so it carries the wrapper's name. <code>wraps<\/code> fixes this."},{"t":"mc","q":"In a function decorated with <code>@contextmanager<\/code>, when does the code after <code>yield<\/code> run?","o":["Before the <code>with<\/code> block starts","Never, it is ignored","Only if an exception happens","When the <code>with<\/code> block exits"],"a":3,"e":"Code before <code>yield<\/code> is the setup. The yielded value is given to the block and the code after it is cleanup, run on exit."}],"py-2-2":[{"t":"mc","q":"Why do threads not speed up pure-Python number crunching in standard CPython?","o":["The GIL lets only one thread run Python bytecode at a time","Threads cannot share variables","Python cannot create more than one thread","Threads only work with files"],"a":0,"e":"The GIL serializes bytecode execution. Use processes for CPU-bound work and threads or asyncio for waiting on I/O."},{"t":"ty","q":"Which keyword before <code>def<\/code> makes a function a coroutine function? Type one word.","a":["async"],"e":"<code>async def<\/code> defines a coroutine function that can use <code>await<\/code>."},{"t":"mc","q":"Inside async code you call <code>fetch(1)<\/code> without <code>await<\/code>, where <code>fetch<\/code> is an <code>async def<\/code>. What do you get?","o":["The function's result","A coroutine object that has not run yet","<code>None<\/code>","A thread"],"a":1,"e":"Calling an async function only creates a coroutine. It runs when awaited or scheduled by the event loop."},{"t":"mc","q":"Three tasks each run <code>await asyncio.sleep(1)<\/code> and are started together with <code>asyncio.gather<\/code>. About how long does it take?","o":["About 3 seconds","About 0 seconds","About 1 second","About 6 seconds"],"a":2,"e":"While one task waits, the event loop runs the others, so the waits overlap."},{"t":"mc","q":"Inside an <code>async def<\/code>, you call <code>time.sleep(2)<\/code>. What is the effect?","o":["Other tasks keep running","It is the same as <code>await asyncio.sleep(2)<\/code>","It raises a SyntaxError","It blocks the whole event loop for 2 seconds"],"a":3,"e":"A normal blocking call never hands control back to the loop. Use <code>await asyncio.sleep()<\/code> instead."}],"py-2-3":[{"t":"mc","q":"Given <code>def f(x: int) -> int: return x<\/code>, what does <code>f(\"a\")<\/code> do at runtime?","o":["Raises TypeError","Returns <code>'a'<\/code> with no error","Converts it to an int","Returns <code>None<\/code>"],"a":1,"e":"Hints are not enforced at runtime. A checker such as mypy would flag the call before you run it."},{"t":"ty","q":"pytest looks for test functions whose names start with which prefix? Type the prefix.","a":["test_","test"],"e":"pytest collects functions named <code>test_...<\/code> and treats a failing <code>assert<\/code> as a failed test."},{"t":"mc","q":"A service uses <code>print()<\/code> everywhere for diagnostics. What is the better practice?","o":["Keep prints but comment them out when needed","Write messages into global variables","Use <code>logging<\/code> with levels such as INFO and ERROR","Use <code>assert<\/code> instead of prints"],"a":2,"e":"Logging adds levels, timestamps and configurable destinations, and can be turned up or down without editing code."},{"t":"mc","q":"<code>cProfile<\/code> shows 90 percent of the time in a function called <code>parse()<\/code>. What next?","o":["Focus on improving <code>parse()<\/code>, for example its algorithm","Spread the time cost with threads everywhere","Rewrite the whole app in another language","Micro-optimize every loop in the project"],"a":0,"e":"Optimize where the measurement points. Speeding up the other 10 percent cannot make much difference."},{"t":"mc","q":"What is <code>pyproject.toml<\/code> used for?","o":["Storing secrets","Holding the compiled bytecode","Listing the tests that must fail","Describing the project: metadata, dependencies and tool settings"],"a":3,"e":"It is the standard config file for packaging and for tools such as pytest, so a project can be built and installed consistently."}],"py-2-4":[{"t":"mc","q":"<code>a = [1, 2]; b = a.copy(); b.append(3)<\/code>. What is <code>a<\/code>?","o":["<code>[1, 2, 3]<\/code>","<code>[3]<\/code>","<code>None<\/code>","<code>[1, 2]<\/code>"],"a":3,"e":"<code>copy()<\/code> makes a new list, so appending to <code>b<\/code> does not touch <code>a<\/code>. Plain assignment <code>b = a<\/code> would."},{"t":"ty","q":"<code>a = [1, 2]; b = [1, 2]<\/code>. What does <code>a is b<\/code> print? Type True or False.","a":["False"],"e":"They are equal in value but are two separate list objects. <code>a == b<\/code> would be True."},{"t":"mc","q":"<code>a = [[1], [2]]; b = a.copy(); b[0].append(9)<\/code>. What is <code>a<\/code>?","o":["<code>[[1], [2]]<\/code>","<code>[[1, 9], [2]]<\/code>","<code>[[9], [2]]<\/code>","<code>[[1], [2], 9]<\/code>"],"a":1,"e":"<code>copy()<\/code> is shallow: the inner lists are shared. Use <code>copy.deepcopy<\/code> to copy nested objects too."},{"t":"mc","q":"<code>def add(item, bucket=[])<\/code> appends and returns <code>bucket<\/code>. After <code>add(1)<\/code>, what does <code>add(2)<\/code> return?","o":["<code>[2]<\/code>","<code>[1]<\/code>","<code>[1, 2]<\/code>","<code>[]<\/code>"],"a":2,"e":"The default list is created once at definition time and reused, so earlier items stay. Use <code>None<\/code> as the default and create the list inside."},{"t":"mc","q":"In CPython, when is an object mainly freed from memory?","o":["When its reference count drops to zero","When the program ends","When you call <code>free()<\/code>","When it is compared with <code>==<\/code>"],"a":0,"e":"Reference counting frees most objects immediately. A cycle collector handles objects that reference each other."}],"py-2-5":[{"t":"mc","q":"What does <code>next([1, 2])<\/code> do?","o":["Returns <code>1<\/code>","Raises TypeError, because a list is iterable but not an iterator","Returns <code>[1, 2]<\/code>","Returns <code>2<\/code>"],"a":1,"e":"A list has <code>__iter__<\/code> but no <code>__next__<\/code>. Use <code>next(iter([1, 2]))<\/code> to get 1."},{"t":"ty","q":"Type the name of the special method that runs when a <code>with<\/code> block starts.","a":["__enter__"],"e":"<code>__enter__<\/code> runs on entry and its return value is bound by <code>as<\/code>. <code>__exit__<\/code> handles the exit."},{"t":"mc","q":"A context manager's <code>__exit__<\/code> returns <code>True<\/code>. The <code>with<\/code> body raises ValueError. What happens next?","o":["The exception propagates normally","The program exits immediately","<code>__exit__<\/code> runs twice","The exception is suppressed and the code after the block runs"],"a":3,"e":"A true return value from <code>__exit__<\/code> tells Python the exception was handled. Returning None or False lets it continue."},{"t":"mc","q":"A class inherits from <code>abc.ABC<\/code> and has an unimplemented <code>@abstractmethod<\/code>. What happens on <code>Cls()<\/code>?","o":["TypeError, because abstract methods are missing","It works and the method returns None","It raises ValueError","It works until the method is called"],"a":0,"e":"Instantiation is blocked until a subclass implements every abstract method."},{"t":"mc","q":"Your function calls <code>len(obj)<\/code> on a custom class. Which method must the class define?","o":["<code>__size__<\/code>","<code>__count__<\/code>","<code>__len__<\/code>","<code>__iter__<\/code>"],"a":2,"e":"<code>len()<\/code> calls <code>__len__<\/code>. That is the protocol at work: any object with the right method qualifies, whatever its class."}],"py-2-6":[{"t":"mc","q":"Which version of a query is safe from SQL injection?","o":["<code>cur.execute(\"... WHERE name = ?\", (name,))<\/code>","<code>cur.execute(f\"... WHERE name = '{name}'\")<\/code>","<code>cur.execute(\"... WHERE name = '\" + name + \"'\")<\/code>","<code>cur.execute(\"... WHERE name = '%s'\" % name)<\/code>"],"a":0,"e":"Parameters are sent separately from the SQL, so user text cannot change the query. The other three paste the text into it."},{"t":"ty","q":"Which standard library module provides <code>environ<\/code> for reading environment variables? Type the module name.","a":["os"],"e":"<code>os.environ<\/code> is a mapping of environment variables, a good place for configuration and secrets."},{"t":"mc","q":"Which HTTP method normally creates a new resource?","o":["GET","POST","DELETE","HEAD"],"a":1,"e":"POST sends data to create something. GET only reads."},{"t":"mc","q":"A teammate committed an API key to the repository. What is the right response?","o":["Delete the line in a new commit and keep the key","Rename the variable","Revoke or rotate the key and move it to an environment variable or secrets manager","Make the repository private and keep using the key"],"a":2,"e":"Anything committed stays in history and must be treated as exposed. Rotate it, then load secrets from outside the code."},{"t":"mc","q":"Why pin dependency versions for a deployed service?","o":["To make Python run faster","To avoid writing tests","To stop pip from needing internet","So builds are repeatable and a new release cannot silently break it"],"a":3,"e":"Pinned versions mean CI and production install exactly what you tested. Unpinned ones can change between builds."}],"ai-0-0":[{"t":"ty","q":"Today's AI systems are very good at specific tasks but not at general reasoning across everything. Type the one-word name for this kind of AI.","a":["narrow","narrowai"],"e":"Every deployed system today is narrow AI. General, human-level flexibility across all tasks is still not what these systems offer."},{"t":"mc","q":"A developer writes <code>if email contains \"free money\": mark as spam<\/code>. Why is this not machine learning?","o":["The rule was written by hand rather than learned from data","It uses text instead of numbers","It only works on emails","It produces a yes/no answer instead of a probability"],"a":0,"e":"ML learns patterns from examples. A hand-written rule is plain programming, even if it solves an AI-style task."},{"t":"mc","q":"A manager claims, \"Our AI will reason about any business problem like a person.\" The best response is that…","o":["That is true once the model has enough layers","Generative AI already does this for every domain","That requires unsupervised learning instead of supervised","Current systems are narrow: strong at specific tasks, not general reasoners"],"a":3,"e":"Even impressive systems are specialized and can fail outside what they were trained and tested for. Setting expectations early avoids misuse."},{"t":"mc","q":"Which ordering goes from the broadest idea to the most specific?","o":["Deep learning, machine learning, AI","Machine learning, AI, deep learning","AI, machine learning, deep learning","AI, deep learning, machine learning"],"a":2,"e":"Deep learning is a kind of ML, and ML is one way of building AI. The reverse nesting is a common mix-up."},{"t":"mc","q":"What makes generative AI different from a spam filter?","o":["It does not use any training data","It creates new content such as text, images or code","It always uses reinforcement learning","It can only classify existing items"],"a":1,"e":"A spam filter sorts existing emails into categories. Generative models produce new output that resembles what they learned."}],"ai-0-1":[{"t":"ty","q":"In a bike-share table, the column you want to predict (rides per hour) is called the what? Type the one-word term used in the lesson.","a":["label","target"],"e":"The label (also called the target) is the answer the model learns to predict. The other columns are features."},{"t":"mc","q":"30% of the weather column is missing in your bike-share data. What is the best first step?","o":["Ignore it; models fill gaps automatically","Find out why values are missing, then impute or drop them deliberately","Delete the weather column without checking its usefulness","Replace every missing value with the label"],"a":1,"e":"Missing data can hide a collection problem. Decide on purpose how to handle it, and never use the label to fill features."},{"t":"mc","q":"A teammate keeps tweaking the model, checking the test score after every change. What is the problem?","o":["The test set is no longer truly unseen, so the final score is optimistic","Nothing; the test set exists to be checked often","The model will train more slowly","The validation set becomes larger"],"a":0,"e":"Repeated peeking tunes the model to the test set. Use the validation set for tuning and touch the test set once at the end."},{"t":"mc","q":"In a table of bike-share data, each row normally represents…","o":["One feature","One label type","One model","One example, such as one hour at one station"],"a":3,"e":"Rows are examples and columns hold features and the label. Confusing the two leads to mis-shaped datasets."},{"t":"mc","q":"A team gets ten times more data, but many rows are mislabeled. What is the most likely result?","o":["Accuracy will certainly improve because there is more data","Mislabeled rows cancel each other out","Errors in the data can flow into the model, so quality still limits results","The test set will fix the labels"],"a":2,"e":"Garbage in, garbage out: more bad data does not guarantee a better model, and quality often matters more than size."}],"ai-0-2":[{"t":"ty","q":"Predicting whether a customer will cancel (yes or no) is which type of supervised task? Type the one-word name.","a":["classification"],"e":"Predicting a category is classification. Predicting a number would be regression."},{"t":"mc","q":"A warehouse robot learns to reach a shelf faster by earning points for speed and losing points for collisions. This is…","o":["Supervised classification","Unsupervised clustering","Reinforcement learning","Dimensionality reduction"],"a":2,"e":"An agent acting in an environment and learning from rewards and penalties is the defining setup of reinforcement learning."},{"t":"mc","q":"A retailer has 200 unlabeled customer features and wants to compress them to a handful so they can be plotted. Which approach fits?","o":["Regression","Dimensionality reduction (unsupervised)","Classification","Reinforcement learning"],"a":1,"e":"With no labels, compressing features is unsupervised dimensionality reduction. PCA is a common method."},{"t":"mc","q":"Predicting tomorrow's temperature in degrees and predicting \"rain or no rain\" are, in that order…","o":["Regression, then classification","Classification, then regression","Both regression","Both clustering"],"a":0,"e":"A number to predict means regression; a category means classification. Weather can be framed either way depending on the target."},{"t":"mc","q":"What is the key difference between supervised and unsupervised learning?","o":["Supervised uses more layers","Unsupervised always needs rewards","Supervised only works on images","Supervised data comes with labels; unsupervised data does not"],"a":3,"e":"Labels are the dividing line. Unsupervised methods look for structure without being told the right answer."}],"ai-0-3":[{"t":"ty","q":"A classifier gets 18 of 24 test examples right. What is its accuracy as a percent? Type the number.","a":["75","75%","0.75"],"e":"Accuracy is correct divided by total: 18/24 = 0.75, which is 75%."},{"t":"mc","q":"<code>model.score(X_te, y_te)<\/code> returns 0.83 for a classifier. What does that mean?","o":["83% of the training examples were memorized","The model is 83% confident in every prediction","83% of features were useful","About 83% of the test examples were classified correctly"],"a":3,"e":"For classifiers, <code>score<\/code> reports accuracy on the data you pass in, here the held-out test set."},{"t":"mc","q":"A teammate trains a model and scores it on the same data it trained on, getting 100%. Why shouldn't you trust it?","o":["100% is mathematically impossible","Training data is always too small","It was measured on data it has already seen, so it may just have memorized it","The score ignores the labels"],"a":2,"e":"Evaluation must use unseen data. A perfect training score says little about how the model generalizes."},{"t":"mc","q":"In the standard ML workflow, what comes immediately after deploying the model?","o":["Collect the data","Monitor it","Split the data","Train it again from scratch"],"a":1,"e":"Deployment is not the end. Real-world data changes, so you monitor performance after launch."},{"t":"mc","q":"In a dataset where 95% of examples are class A, a model that always predicts A has accuracy of…","o":["95%","50%","5%","100%"],"a":0,"e":"It gets every class A example right, which is 95% of the data, while learning nothing. That is why accuracy misleads on imbalanced data."}],"ai-0-4":[{"t":"ty","q":"Generative models can produce confident but false output. Type the one-word term for this.","a":["hallucination","hallucinations"],"e":"A hallucination is fluent, confident output that is not true. It is why important claims must be verified."},{"t":"mc","q":"A resume screener rejects far more women. Its training data was past hiring decisions at a mostly male company. What is the best next step?","o":["Audit outcomes by group, fix the data or features, and keep human review","Ship it because the model is accurate on average","Add more layers to the model","Hide the model's decisions from applicants"],"a":0,"e":"Models copy historical unfairness. Measure results across groups, correct the cause and keep oversight in place."},{"t":"mc","q":"A developer wants to store every user's full chat history \"just in case it is useful.\" Which responsible-AI principle does this go against?","o":["Transparency about model size","Hallucination control","Data augmentation","Privacy: collect only what you need and protect it"],"a":3,"e":"Collecting data without a purpose raises risk. Responsible practice is to gather the minimum you need and secure it."},{"t":"mc","q":"Removing the gender column from hiring data does not guarantee fairness because…","o":["Models cannot work without gender","Fairness is only about model speed","Other features, such as names or clubs, can act as proxies","The test set will restore the column"],"a":2,"e":"Correlated features can stand in for removed attributes, so bias can survive. You must test the outcomes directly."},{"t":"mc","q":"Transparency in AI means that…","o":["The model's weights are always published","People know AI is involved and can understand major decisions","Only engineers see the results","Outputs are never reviewed"],"a":1,"e":"It is about informing and explaining to the people affected, not necessarily releasing code or weights."}],"ai-0-5":[{"t":"ty","q":"How many numbers describe a 100 by 100 color (RGB) image? Type the number.","a":["30000","30,000"],"e":"100 x 100 pixels x 3 color channels = 30,000 numbers."},{"t":"mc","q":"A voice-note app must transcribe audio. What is commonly done to the sound wave before a model reads it?","o":["It is converted to capital letters","It is turned into a spectrogram showing frequency over time","It is resized to 224 by 224 pixels in RGB only","It is split into sentences by hand"],"a":1,"e":"Audio is sampled as numbers, and a spectrogram turns it into a picture of frequencies over time that models handle well."},{"t":"mc","q":"A search box finds documents about \"automobiles\" when the user types \"car\", although the words differ. What makes this possible?","o":["Embeddings place similar meanings close together","Pixels are stored as 0 to 255","The text is lowercased","Tokens are assigned random IDs"],"a":0,"e":"Embeddings are vectors where related meanings are near each other, so matching works on meaning rather than exact spelling."},{"t":"mc","q":"What range does each color channel of a pixel typically use?","o":["0 to 1000","-1 to 1 only","1 to 10","0 to 255"],"a":3,"e":"Each of red, green and blue is a whole number from 0 to 255 in standard 8-bit images."},{"t":"mc","q":"Why do tokenizers often split rare words into smaller word pieces?","o":["To make every word exactly three characters","To remove the need for embeddings","So unfamiliar words can be built from known pieces","Because models only read vowels"],"a":2,"e":"Word pieces keep the vocabulary manageable while still handling new or rare words."}],"ai-0-6":[{"t":"ty","q":"According to the lesson, a good request has how many parts (task, context, format and an example)? Type the number.","a":["4","four"],"e":"The four parts are the task, the context, the format you want and an example when style matters."},{"t":"mc","q":"An assistant's summary of a report is too generic. What is the best next move?","o":["Accept it as final since AI is objective","Ask the identical question again unchanged","Iterate: say the audience, length and what to focus on","Paste the whole company database as context"],"a":2,"e":"Treat the first answer as a draft and refine with specifics. Vague requests produce vague results."},{"t":"mc","q":"An employee wants to paste a confidential customer contract into a free public chatbot to summarize it. What should happen?","o":["Go ahead; the chatbot forgets everything instantly","Use an approved tool or follow the data policy instead","Paste it, but only after lowercasing the text","Paste half of it to be safe"],"a":1,"e":"Do not share confidential data with unapproved tools. Check policy and use sanctioned options."},{"t":"mc","q":"An assistant cites a court case you plan to include in a filing. What should you do first?","o":["Verify the case exists and says what is claimed","Trust it because it sounds formal","Rephrase the case name","Ask the assistant to say it is sure"],"a":0,"e":"Assistants can invent plausible sources. Checking references is your responsibility."},{"t":"mc","q":"An email you send contains an error that came from an AI draft. Who is accountable?","o":["The AI tool","The company that trained the model","Nobody; AI output is exempt","You, because you own what you send"],"a":3,"e":"The tool is an aid; the person who sends or ships the result is accountable for it."}],"ai-1-0":[{"t":"ty","q":"Which method builds trees one after another, each fixing the previous one's errors, and is a top choice for tabular data? Type the two-word name.","a":["gradientboosting","gradientboostedtrees"],"e":"Gradient boosting adds trees sequentially, each focusing on the remaining errors. Random forests build trees independently and average them."},{"t":"mc","q":"A team skips simple models and starts with a large neural network for churn. What is the main problem?","o":["Neural networks cannot use tabular data at all","Baselines are only for images","Simple models never beat complex ones","Without a baseline you cannot tell if the complexity pays off"],"a":3,"e":"A fancy model has to beat a simple baseline to justify its cost. The baseline also reveals how hard the problem is."},{"t":"mc","q":"One deep decision tree scores 100% on training data and 80% on test data. A sensible next step is…","o":["Make the single tree even deeper","Remove the test set","Try a random forest, which averages many trees to reduce variance","Switch to k-means"],"a":2,"e":"A deep single tree overfits. Averaging many trees smooths out their individual quirks."},{"t":"mc","q":"Which model is easiest to explain to a non-technical manager as a series of yes/no questions?","o":["Gradient boosting with hundreds of trees","A decision tree","A random forest of 500 trees","k-means with 12 clusters"],"a":1,"e":"A single tree can be read like a flowchart. Ensembles are more accurate but harder to read."},{"t":"mc","q":"Which of these is an unsupervised algorithm?","o":["k-means","Logistic regression","Linear regression","Random forest classifier"],"a":0,"e":"k-means groups data without labels. The others learn from labeled targets."}],"ai-1-1":[{"t":"ty","q":"A model finds 30 true positives and misses 10 real positives (false negatives). What is its recall? Type a decimal like 0.5.","a":["0.75",".75","75%","75"],"e":"Recall = TP / (TP + FN) = 30 / 40 = 0.75."},{"t":"mc","q":"A fraud model has high precision but low recall, and missing fraud is very costly. What should you do?","o":["Lower the decision threshold to catch more fraud, accepting more false alarms","Raise the threshold to be more certain","Report only precision","Stop using the confusion matrix"],"a":0,"e":"A lower threshold flags more cases, raising recall at the cost of precision. Match the trade-off to the cost of errors."},{"t":"mc","q":"One random train/test split gives 0.91 and another gives 0.84. Which technique gives a more reliable estimate?","o":["Using the test set to tune","Training for more epochs","Adding more features","Cross-validation"],"a":3,"e":"Cross-validation averages results across several splits, so one lucky or unlucky split matters less."},{"t":"mc","q":"A model has precision 0.9 and recall 0.1. Its F1 score is closest to…","o":["0.50","0.90","0.18","0.10"],"a":2,"e":"F1 is the harmonic mean: 2 x 0.9 x 0.1 / 1.0 = 0.18. It stays low unless both are high, unlike the plain average of 0.5."},{"t":"mc","q":"A spam filter should rarely send real email to the spam folder. Which metric deserves the most attention?","o":["Recall on the spam class","Precision on the spam class","Training accuracy","Number of epochs"],"a":1,"e":"A false positive is a real email wrongly flagged. High precision means that when it says spam, it is almost always right."}],"ai-1-2":[{"t":"ty","q":"A layer has 4 inputs and 3 neurons, each with its own bias. How many trainable parameters does it have? Type the number.","a":["15"],"e":"Weights: 4 x 3 = 12. Biases: 3. Total 15."},{"t":"mc","q":"After raising the learning rate, loss swings wildly and then turns into NaN. The most likely fix is to…","o":["Raise it even more","Lower the learning rate","Remove the loss function","Add more epochs"],"a":1,"e":"Steps that are too large overshoot the minimum and can diverge. Reducing the learning rate stabilizes training."},{"t":"mc","q":"Training loss falls extremely slowly but smoothly over many epochs. What is a likely cause?","o":["The learning rate is too small","The learning rate is too large","Softmax is missing","The batch contains too many classes"],"a":0,"e":"Tiny steps make progress, but at a crawl. A moderately larger learning rate often speeds it up."},{"t":"mc","q":"Why do neural networks need non-linear activation functions such as ReLU?","o":["To make outputs sum to 1","To compute gradients","To shuffle the data","Without them, stacked layers collapse into one linear transformation"],"a":3,"e":"Linear layers composed together are still linear. Activations let the network model curved, complex relationships."},{"t":"mc","q":"A dataset has 1000 examples and the batch size is 100. How many weight updates occur in one epoch?","o":["100","1000","10","1"],"a":2,"e":"One epoch covers all the data, and 1000 / 100 = 10 batches, so 10 updates."}],"ai-1-3":[{"t":"ty","q":"Turning a category such as red, green, blue into separate 0/1 columns is called what? Type the two-word term, hyphen optional.","a":["one-hot","onehot","one-hotencoding","onehotencoding"],"e":"One-hot encoding gives each category its own binary column, so the model does not read a false numeric order."},{"t":"mc","q":"A churn model scores 99% in testing but fails in production. One feature is <code>account_closed_reason<\/code>. What is the likely cause?","o":["Underfitting","The learning rate was too high","Data leakage: the feature is only known after the customer leaves","Too few epochs"],"a":2,"e":"The feature would not exist at prediction time, so the model looked great by using future information."},{"t":"mc","q":"You standardize all rows using the mean of the full dataset and then split into train and test. What is wrong?","o":["Standardization needs labels","Test-set information leaked into preprocessing","Nothing; scalers use all data","The mean should be zero first"],"a":1,"e":"Fit scalers on the training split only, then apply them to the test data. A Pipeline handles this automatically."},{"t":"mc","q":"Which is a reasonable way to handle 5% missing values in a numeric column?","o":["Impute with the training-set median, fit on training data only","Fill them with the label","Replace them with 0 regardless of meaning","Delete the column in every case"],"a":0,"e":"Imputation is standard, and the fill value must come from training data only to avoid leakage. A blind 0 can distort the meaning."},{"t":"mc","q":"What is a key benefit of wrapping preprocessing and model in a Pipeline?","o":["It makes the model deeper","It removes the need for a test set","It guarantees higher accuracy","The same steps apply identically in training and prediction, without leakage in cross-validation"],"a":3,"e":"Pipelines keep the steps consistent and re-fit them inside each fold, which prevents accidental leakage."}],"ai-1-4":[{"t":"ty","q":"Type the three-letter acronym for the technique that finds the directions keeping the most variation, used to compress features.","a":["pca"],"e":"Principal component analysis finds directions of greatest variance and projects data onto the top few."},{"t":"mc","q":"k-means on customer data splits almost entirely by income (tens of thousands) and ignores visits per month (0 to 30). The best fix is to…","o":["Increase the number of epochs","Add labels","Use accuracy to score it","Scale the features before clustering"],"a":3,"e":"Distance-based methods are dominated by large-unit features. Standardizing puts them on similar ranges."},{"t":"mc","q":"The elbow plot of k-means error versus k bends sharply at k = 4. What does that suggest?","o":["Exactly four labels exist in the data","The model is overfitted","Four clusters is a reasonable choice to try","k must always equal 4"],"a":2,"e":"Beyond the elbow, extra clusters bring little improvement. It is a guide, so check the groups also make business sense."},{"t":"mc","q":"A factory has sensor readings with no failure labels and wants to spot faulty sensors. Which approach fits?","o":["Regression on the failure label","Anomaly detection","Supervised classification","Reinforcement learning"],"a":1,"e":"Without labels, flag readings that do not fit the usual pattern."},{"t":"mc","q":"How can you judge a clustering when there are no labels?","o":["Use a measure like silhouette score and check that the segments are meaningful and useful","Compute test accuracy","Count the number of rows","Pick the clustering with the most clusters"],"a":0,"e":"Unsupervised results are judged by internal measures and usefulness to people, since there is no ground-truth label."}],"ai-1-5":[{"t":"ty","q":"Which regularization, L1 or L2, can push some weights to exactly zero? Type L1 or L2.","a":["l1","l1regularization","lasso"],"e":"L1 creates sparse weights by zeroing some out. L2 shrinks weights but rarely makes them exactly zero."},{"t":"mc","q":"Learning curves show training and nce models and transformers capture order."},{"t":"mc","q":"In 50,000 tickets, words like \"please\" and \"the\" appear everywhere. Which technique helps surface the words that distinguish each topic?","o":["TF-IDF weighting","Raw word counts only","Random sampling","One-hot encoding of ticket IDs"],"a":0,"e":"TF-IDF downweights common words and highlights distinctive ones."},{"t":"mc","q":"You want to find tickets that mean the same thing even though one says \"refund\" and another says \"money back\". What helps most?","o":["Bag of words","Exact keyword matching","Lowercasing","Word or sentence embeddings"],"a":3,"e":"Embeddings place similar meanings near each other, so different wording can still match."},{"t":"mc","q":"Which task is an example of named entity recognition?","o":["Deciding if a ticket is positive or negative","Translating a ticket","Finding person, company and place names in a ticket","Grouping tickets by topic"],"a":2,"e":"NER tags spans of text as entities. The other options are sentiment, translation and topic classification."}],"ai-2-0":[{"t":"ty","q":"Type the three-letter acronym for the architecture that scans images with convolutions.","a":["cnn"],"e":"Convolutional neural networks reuse small filters across positions to detect local patterns such as edges and textures."},{"t":"mc","q":"You have only 500 labeled X-ray images. What is the most practical approach?","o":["Train a huge network from scratch","Use k-means and skip labels","Fine-tune a pretrained model with transfer learning","Wait until you have a million images"],"a":2,"e":"Pretrained models already know general visual features, so small datasets can adapt them effectively."},{"t":"mc","q":"For text where distant words strongly relate, why can a transformer beat an LSTM?","o":["It processes words strictly one at a time","Self-attention lets any token look directly at any other token","It has no embeddings","It ignores word order and meaning"],"a":1,"e":"LSTMs pass information
