trk("py").tiers[0].levels.push(L("Fix It: The Broken Check","A teammate's weight check crashes before it even runs. Find every bug and repair it.",
 `<p>Reading broken code is a skill of its own. Python's error message names a line, and the bug is often on that line or the one just before it.</p>
<ul><li>A <code>SyntaxError</code> means Python could not even read the code. A missing colon or an unmatched bracket is the usual cause.</li>
<li>Wrong output means the code ran but the logic is off. Check every comparison against the examples, especially the boundary values.</li>
<li><code>"True"</code> in quotes is text. <code>True</code> without quotes is a real boolean. They print the same but behave differently.</li></ul>
<p>The starter code in the next screen has three bugs. Fix them so every test passes.</p>`,[],
 {code:{prompt:`This function should return <code>True</code> when a parcel is heavier than 20 and <code>False</code> otherwise. It has <b>three</b> bugs. Fix the code so all tests pass.`,
  starter:`def is_heavy(weight):\n    if weight >= 20\n        return "True"\n    else:\n        return False\n`,
  tests:[{run:"print(is_heavy(25))",expect:"True"},{run:"print(is_heavy(20))",expect:"False"},{run:"print(is_heavy(5))",expect:"False"},{run:"print(is_heavy(21) is True)",expect:"True"}],
  hint:"Count the problems: one line is missing its colon, one comparison includes the boundary it should not, and one return gives text instead of a real boolean.",
  solution:`def is_heavy(weight):\n    if weight > 20:\n        return True\n    else:\n        return False`}}));
trk("py").tiers[1].levels.push(L("Fix It: Off By One","A report shows the wrong rows. The slice is off by one.",
 `<p>The most common bug in all of programming is the <b>off-by-one error</b>. A list of length 4 has indexes 0 to 3, and a slice <code>items[a:b]</code> includes <code>a</code> but stops before <code>b</code>.</p>
<ul><li><code>items[-2:]</code> means the last two items. <code>items[len(items) - 2:]</code> means the same thing.</li>
<li>When output is close but not right, test the smallest case by hand and count.</li></ul>
<p>Fix the function in the next screen.</p>`,[],
 {code:{prompt:`<code>last_n(items, n)</code> should return the last <code>n</code> items of a list. It currently drops one item too many. Fix it.`,
  starter:`def last_n(items, n):\n    return items[len(items) - n + 1:]\n`,
  tests:[{run:"print(last_n([1, 2, 3, 4], 2))",expect:"[3, 4]"},{run:`print(last_n(["a", "b", "c"], 3))`,expect:"['a', 'b', 'c']"},{run:"print(last_n([5], 1))",expect:"[5]"}],
  hint:"Try the smallest case by hand: for [5] and n=1 the slice must start at index 0. What does len(items) - n + 1 give?",
  solution:`def last_n(items, n):\n    return items[len(items) - n:]`}}));
trk("py").tiers[2].levels.push(L("Fix It: The Shared Default","Tags from one customer leak into the next customer's record.",
 `<p>A default value in a <code>def</code> line is created <b>once</b>, when the function is defined, not on every call. If that default is a list, every call shares the same list.</p>
<ul><li>That is why <code>def f(x, items=[])</code> is a classic trap.</li>
<li>The fix is to default to <code>None</code> and create a fresh list inside the function.</li></ul>
<p>Fix the function in the next screen.</p>`,[],
 {code:{prompt:`<code>add_tag(tag, tags=[])</code> should return a list containing the tag. Called twice with no list, the second call must <b>not</b> contain the first tag. Right now it does. Fix it.`,
  starter:`def add_tag(tag, tags=[]):\n    tags.append(tag)\n    return tags\n`,
  tests:[{run:`print(add_tag("a"))\nprint(add_tag("b"))`,expect:"['a']\n['b']"},{run:`print(add_tag("z", ["q"]))`,expect:"['q', 'z']"}],
  hint:"Change the default to None. Inside the function, if tags is None, set tags = [] so each call gets its own new list.",
  solution:`def add_tag(tag, tags=None):\n    if tags is None:\n        tags = []\n    tags.append(tag)\n    return tags`}}));

trk("cy").tiers[0].levels.push(L("Lab: Lock Down a Secret File","Sam kept a file of passwords on a shared laptop, and everyone on the machine can read it.",
 `<p>Linux decides who may read, write or run a file with <b>permissions</b>. <code>ls -l</code> shows them as ten characters such as <code>-rw-r--r--</code>: the owner, the group, and everyone else, in that order.</p>
<ul><li><code>r</code> read, <code>w</code> write, <code>x</code> run.</li>
<li><code>chmod 600 file</code> gives the owner read and write, and everyone else nothing.</li>
<li><code>who</code> lists who is logged in right now.</li></ul>
<p>The terminal is simulated, but the commands are real. Type <code>help</code> for your current goal.</p>`,[],
 {lab:{user:"sam",host:"shared-laptop",ls:"notes.txt  passwords.txt",known:KNOWN,
  intro:"Shared laptop in the front office. Sam's file passwords.txt is in the home folder.",
  debrief:"You inspected the permissions, saw that everyone could read the file, restricted it to the owner with chmod 600, verified the change and checked who else was logged in. Better still: do not keep passwords in a text file at all. Use a password manager.",
  steps:[
   S("List the files with their permissions using the long format.","ls -l",[/^ls -(l|la|al|lh|lah)$/],"-rw-r--r-- 1 sam sam  96 Nov 18 09:01 notes.txt\n-rw-rw-rw- 1 sam sam 214 Nov 18 09:12 passwords.txt"),
   S("passwords.txt is readable and writable by everyone. Restrict it so only the owner can read and write.","chmod 600 passwords.txt",[/^chmod 600 passwords\.txt$/,/^chmod u=rw,go= passwords\.txt$/,/^chmod go-rw passwords\.txt$/],"(no output: permissions changed)"),
   S("Check that the change worked by listing passwords.txt in the long format.","ls -l passwords.txt",[/^ls -l(h)? passwords\.txt$/],"-rw------- 1 sam sam 214 Nov 18 09:12 passwords.txt"),
   S("See who else is logged in to this laptop right now.","who",[/^who$/],"sam   tty2   2026-11-18 08:55\nguest pts/0   2026-11-18 09:10 (192.168.1.40)")
  ]}}));
trk("nw").tiers[0].levels.push(L("Lab: Your First Network Checks","The office printer cannot be reached. Start with the basics and work outward.",
 `<p>Every network problem starts with the same four questions, asked from the inside out:</p>
<ul><li><code>ip addr</code>: does this machine have an address?</li>
<li><code>ping</code> the gateway (the router): can I reach my own network?</li>
<li><code>ping</code> an address on the internet: can I get out?</li>
<li><code>ping</code> a name: does DNS work?</li></ul>
<p>The terminal is simulated, but the commands are real. Type <code>help</code> for your current goal.</p>`,[],
 {lab:{user:"office",host:"office-pc",ls:"Desktop  Documents",known:KNOWN,

   S("Confirm DNS works by pinging a name: example.com.","ping -c 3 example.com",[/^ping( -c ?3)? example\.com$/],"PING example.com (93.184.216.34): 64 bytes from 93.184.216.34: time=14 ms\n--- 3 packets transmitted, 3 received, 0% packet loss")
  ]}}));

}

function npcUpdate(n,dt){
  var dx=town.px-n.x,dy=town.py-n.y,d=Math.sqrt(dx*dx+dy*dy),near=d<(n.keeper?130:70);
  if(near&&!n.close){n.close=true;n.sayT=4.2;if(!n.keeper){n.v=(n.v||0)+1;if(n.qi!==undefined&&n.v%2===1)n.say=questLine(n.qi);else{n.tip=(n.tip+1)%TIPS.length;n.say=TIPS[n.tip]}}}
  if(!near&&d>110)n.close=false;
  if(n.sayT>0)n.sayT-=dt;
  if(n.keeper){n.face=near?(Math.abs(dx)>Math.abs(dy)*1.4?(dx>0?"right":"left"):"down"):"down";return}
  if(near&&d<70){n.moving=false;n.face=Math.abs(dx)>Math.abs(dy)?(dx>0?"right":"left"):(dy>0?"down":"up");return}
  if(n.tx===null){
    n.moving=false;n.wait-=dt;
    if(n.wait<=0){
      var w=town.wr;
      for(var tries=0;tries<10;tries++){var tx=w.x0+Math.random()*(w.x1-w.x0),ty=w.y0+Math.random()*(w.y1-w.y0);if(!townHit(tx,ty)){n.tx=tx;n.ty=ty;break}}
      n.wait=1+Math.random()*3;n.stuck=0;
    }
    return;
  }
  var vx=n.tx-n.x,vy=n.ty-n.y,l=Math.sqrt(vx*vx+vy*vy);
  if(l<4){n.tx=null;n.moving=false;return}
  vx/=l;vy/=l;var sp=44,ox=n.x,oy=n.y,nx=n.x+vx*sp*dt,ny=n.y+vy*sp*dt;
  if(!townHit(nx,oy))n.x=nx;if(!townHit(n.x,ny))n.y=ny;
  if(Math.abs(n.x-ox)+Math.abs(n.y-oy)>.02){n.moving=true;n.phase+=dt*8;n.stuck=0;n.face=Math.abs(vx)>Math.abs(vy)?(vx>0?"right":"left"):(vy>0?"down":"up")}
  else{n.stuck+=dt;if(n.stuck>.4){n.tx=null;n.moving=false}}
}

function findPath(tx,ty){

  function ok(cx,cy){return !townHit(cx*st+st/2,cy*st+st/2)}
  var sx=Math.floor(town.px/st),sy=Math.floor(town.py/st),gx=Math.floor(tx/st),gy=Math.floor(ty/st);
  if(sx<0||sy<0||gx<0||gy<0||sx>=cols||gx>=cols||sy>=rows||gy>=rows)return null;
  var prev=new Int32Array(cols*rows).fill(-1),start=sy*cols+sx,goal=gy*cols+gx,q=[start],head=0;prev[start]=start;
  while(head<q.length){

function draw(key,pool,n){
  if(pool.length<=n)return shuffle(pool);
  var seen=S.seen[key]||[];
  var fresh=pool.filter(function(p){return seen.indexOf(p.i)<0});
  var take=shuffle(fresh).slice(0,n);
  if(take.length<n){
    var rest=shuffle(pool.filter(function(p){return take.indexOf(p)<0}));
    take=take.concat(rest.slice(0,n-take.length));
    S.seen[key]=take.map(function(p){return p.i});
  }else S.seen[key]=seen.concat(take.map(function(p){return p.i}));
  save();
  return shuffle(take);
}

var SK_SRC=[

var skP=null;
function addScript(src){return new Promise(function(res,rej){var s=document.createElement("script");s.src=src;s.onload=res;s.onerror=function(){s.remove();rej(new Error("load failed"))};document.head.appendChild(s)})}
function skOK(){return !!(window.Sk&&Sk.builtinFiles&&Sk.misceval)}
function loadSk(){
  if(skOK())return Promise.resolve();
  if(skP)return skP;
  var i=0;
  function tryNext(){
    if(i>=SK_SRC.length)return Promise.reject(new Error("no source"));
    var pair=SK_SRC[i++];
    return addScript(pair[0]).then(function(){return addScript(pair[1])}).then(function(){if(!skOK())throw new Error("bad");skUsed=pair[0]}).catch(function(){return tryNext()});
  }
  skP=tryNext().catch(function(e){skP=null;throw e});
  return skP;
}
function runPy(code){
  return new Promise(function(resolve){
    var out="";
    try{
      Sk.configure({output:function(t){out+=t},read:function(x){if(Sk.builtinFiles===undefined||Sk.builtinFiles["files"][x]===undefined)throw "File not found: '"+x+"'";return Sk.builtinFiles["files"][x]},__future__:Sk.python3,execLimit:4000});
      Sk.execStart=Date.now();
      Sk.misceval.asyncToPromise(function(){return Sk.importMainWithBody("<stdin>",false,code,true)}).then(function(){resolve({out:out})},function(err){resolve({out:out,err:String(err&&err.toString?err.toString():err)})});
    }catch(e){resolve({out:out,err:String(e)})}
  });
}
function runTests(code,tests){
  var res=[],p=Promise.resolve();
  tests.forEach(function(t){p=p.then(function(){return runPy(code+"\n"+t.run)}).then(function(r){res.push({t:t,r:r})})});
  return p.then(function(){return res});
}
function tailMatch(out,exp){

function chLoop(ts){

  var dt=Math.max(0,Math.min(.05,(ts-ch.last)/1000||0));ch.last=ts;ch.t+=dt;
  var cv=ch.cv,g=cv.getContext("2d"),w=cv.width,h=cv.height,k=w/260;
  g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,w,h);
  var gr=g.createRadialGradient(w/2,h*.62,10,w/2,h*.62,w*.7);gr.addColorStop(0,"#26305f");gr.addColorStop(1,"#0c1226");g.fillStyle=gr;g.fillRect(0,0,w,h);
  g.setTransform(k,0,0,k,0,0);
  g.fillStyle="rgba(127,156,255,.18)";g.beginPath();g.ellipse(130,262,70,16,0,0,6.283);g.fill();
  g.strokeStyle="rgba(127,156,255,.4)";g.lineWidth=2;g.beginPath();g.ellipse(130,262,70,16,0,0,6.283);g.stroke();

}

/* better failing-test advice */
function testAdvice(x){
  var e=x.r.err,out=String(x.r.out).replace(/\s+$/,"");
  if(e){
    if(/SyntaxError|invalid syntax|ParseError/i.test(e))return "Python could not read your code at all. Look for a missing colon after if, else, for or def, an unclosed bracket or quote, or a stray character.";
    if(/IndentationError|indent/i.test(e))return "The indentation is off. Lines inside a function or an if must be indented by the same four spaces.";
    if(/NameError/i.test(e))return "A name is used that does not exist yet. Check the spelling, and make sure a variable is assigned before it is used.";
    if(/TypeError/i.test(e))return "Two values of different types met. For example, you may be adding text to a number: convert with str() or int().";
    if(/KeyError|IndexError/i.test(e))return "You asked for a key or position that is not there. Check the name or the index you are using.";
    return "Your code stopped with an error. Read the last line of the message above: it names the kind of error and where it happened.";
  }
  if(!out)return "The code printed nothing for this test. If this is a function, make sure it uses return, because the test prints the returned value.";
  if(out==="None")return "The function returned None. Add a return statement that gives back the answer instead of only computing or printing it.";
  if(/^(True|False)$/.test(String(x.t.expect))&&/^(true|false)$/i.test(out))return "The True or False result is wrong. Re-check the comparison, especially the boundary value (> versus >=).";
  return "The code ran, but the result differs from what the test expects. Compare the Expected and Got lines character by character, then trace your code by hand with this input.";
}

  ["acc","top"].forEach(function(k){var id=PROFILE[k];if(shopItem(id))S.wear[id]=(S.wear[id]||0)+1});save();
}
function trophyCase(){
  var tl=trophyList(),h='<h3 class="sech">Trophy case</h3>';
  h+=tl.length?'<div class="trophies">'+tl.map(function(x){return '<div class="troph">'+trophySvg(x.c)+'<b>'+esc(x.n)+'</b><span>'+esc(x.s)+'</span></div>'}).join("")+'</div>':'<p class="meta">Defeat a tier boss (pass a tier exam) to earn a trophy.</p>';
  return h;
}
function wallHtml(){
  var h='<h3 class="sech">Wall of fame</h3><div class="fame"><div><p class="label">Arcade high scores</p>'+ARCGAMES.map(function(g){var b=arcBest(g.id),n=(GAMES[g.id].mk().length);return '<div class="frow"><span>'+esc(g.label)+'</span><b>'+(b?b+' / '+n+(b>=n?' ★':''):'-')+'</b></div>'}).join("")+'</div>';
  var wr=Object.keys(S.wear||{}).filter(function(k){return shopItem(k)}).sort(function(a,b){return S.wear[b]-S.wear[a]}).slice(0,3);
  h+='<div><p class="label">Most-worn items</p>'+(wr.length?wr.map(function(k,i){return '<div class="frow"><span>'+(i+1)+'. '+esc(shopItem(k).n)+'</span><b>'+S.wear[k]+' day'+(S.wear[k]===1?'':'s')+'</b></div>'}).join(""):'<p class="meta">Wear a shop item and it will be counted once each day you play.</p>')+'</div></div>';
  return h;
}
/* friend codes (local, no server) */
function friendCode(){
  var ar={};ARCGAMES.forEach(function(g){ar[g.id]=arcBest(g.id)});
  return "SFC:"+btoa(unescape(encodeURIComponent(JSON.stringify({n:PROFILE.name||"Player",xp:S.xp,lv:doneCount(),st:S.streak.best||0,tr:trophyList().length,ar:ar,d:ymd(new Date())}))));
}
function addFriend(c){
  c=(c||"").trim();if(c.indexOf("SFC:")!==0)return "That does not look like a friend code.";
  var o;try{o=JSON.parse(decodeURIComponent(escape(atob(c.slice(4)))))}catch(e){return "The code is damaged or incomplete."}
  if(!o||typeof o.n!=="string"||typeof o.xp!=="number")return "The code is missing player data.";
  var nm=o.n.slice(0,20),own=PROFILE.name||"Player";if(nm===own&&o.xp===S.xp)return "That is your own code.";
  S.friends[nm]={xp:o.xp|0,lv:o.lv|0,st:o.st|0,tr:o.tr|0,d:String(o.d||"").slice(0,10)};save();return "";
}
function friendsHtml(){
  var rows=[{n:(PROFILE.name||"Player"),xp:S.xp,lv:doneCount(),st:S.streak.best||0,tr:trophyList().length,me:1,d:"today"}];
  Object.keys(S.friends||{}).forEach(function(k){var f=S.friends[k];rows.push({n:k,xp:f.xp,lv:f.lv,st:f.st,tr:f.tr,d:f.d})});
  rows.sort(function(a,b){return b.xp-a.xp});
  return '<h3 class="sech">Friends</h3><p class="meta">Compare progress without an account. Copy your friend code and send it to a friend. Paste theirs below. Codes are snapshots, so ask friends for a fresh one to update their row.</p>'+
   '<div class="tblwrap"><table class="friends"><thead><tr><th>#</th><th>Player</th><th>XP</th><th>Levels</th><th>Best streak</th><th>Trophies</th><th>As of</th><th></th></tr></thead><tbody>'+
   rows.map(function(r,i){return '<tr'+(r.me?' class="me"':'')+'><td>'+(i+1)+'</td><td>'+esc(r.n)+(r.me?' (you)':'')+'</td><td>'+r.xp+'</td><td>'+r.lv+'</td><td>'+r.st+'</td><td>'+r.tr+'</td><td>'+esc(r.d)+'</td><td>'+(r.me?'':'<button class="link" data-act="rmfriend" data-n="'+esc(r.n)+'" aria-label="Remove '+esc(r.n)+'">Remove</button>')+'</td></tr>'}).join("")+'</tbody></table></div>'+
   '<textarea id="mycode" class="codebox" rows="2" readonly aria-label="Your friend code">'+friendCode()+'</textarea><div class="actions"><button class="btn" data-act="copyfriend">Copy my friend code</button></div>'+
   '<textarea id="fcode" class="codebox" rows="2" placeholder="Paste a friend code here" spellcheck="false" aria-label="Friend code to add"></textarea><div class="actions"><button class="btn ghost" data-act="addfriend">Add friend</button></div><p class="meta" id="fmsg" role="status"></p>';
}
/* question sheet for expert review */
function plain(s){var d=document.createElement("div");d.innerHTML=String(s);return d.textContent.replace(/\s+/g," ").trim()}
function questionsCsv(){
  function q(v){return '"'+String(v).replace(/"/g,'""')+'"'}
  var rows=[["id","subject","tier","level","type","question","options","correct_answer","explanation","reviewer_verdict","reviewer_notes"]];
  TR.forEach(function(t){t.tiers.forEach(function(tr,ti){tr.levels.forEach(function(lv,li){lv.qs.forEach(function(x,i){
    var opts=x.t==="mc"?x.o.map(function(o,n){return String.fromCharCode(65+n)+") "+plain(o)}).join(" | "):"",ans=x.t==="mc"?String.fromCharCode(65+x.a)+") "+plain(x.o[x.a]):x.a.join(" / ");
    rows.push([t.id+"-"+ti+"-"+li+"#"+i,t.name,tr.name,lv.title,x.t==="mc"?"multiple choice":"typed",plain(x.q),opts,ans,plain(x.e),"",""]);
  })})})});
  return "﻿"+rows.map(function(r){return r.map(q).join(",")}).join("\r\n");
}
/* guided tour */
var TOUR=[["Walk around","Move with the arrow keys or WASD. On a phone, drag the joystick, or tap anywhere to walk there. Press E, Enter or Space at a door to go in."],["Every building is a subject","Python, AI, Cybersecurity and Networking each have a shop. Inside, walk to the level board. Levels unlock one after another, and each tier ends with a boss exam."],["Earn gold, spend it","Quests, the daily goal and clearing levels earn gold. Spend it in the Shop on outfits and town upgrades, or at the Arcade for quick practice games."],["Your menu","The Menu button shows progress, badges, trophies and friends. Questions you miss come back in the Review shop. You can replay this tour any time from Help."]];
var tourI=0;
function tourSeen(){try{return localStorage.getItem("skillforge-tour")==="1"}catch(e){return true}}
function tourEnd(){var o=$("#tour");if(o)o.remove();try{localStorage.setItem("skillforge-tour","1")}catch(e){}}
function tourShow(){
  var o=$("#tour");if(!o){o=document.createElement("div");o.id="tour";o.setAttribute("role","dialog");o.setAttribute("aria-modal","true");o.setAttribute("aria-label","Guided tour");document.body.appendChild(o)}
  var s=TOUR[tourI],last=tourI===TOUR.length-1;
  o.innerHTML='<div class="tourbox"><p class="label">Quick tour · '+(tourI+1)+' of '+TOUR.length+'</p><h2>'+s[0]+'</h2><p>'+s[1]+'</p><div class="actions"><button class="btn" data-act="tournext">'+(last?"Start playing":"Next")+'</button>'+(last?'':'<button class="btn ghost" data-act="tourskip">Skip tour</button>')+'</div></div>';
  var b=o.querySelector(".btn");if(b)b.focus();
}
function tourStart(force){if(!force&&tourSeen())return;if(!PROFILE.saved)return;tourI=0;tourShow()}

function failHtml(res,c){
  var fi=-1,np=0;res.forEach(function(x,i){var o=!x.r.err&&tailMatch(x.r.out,x.t.expect);if(o)np++;else if(fi<0)fi=i});
  return '<div class="fb no"><strong>Not yet. '+np+' of '+res.length+' tests pass.</strong><p><b>Start with test '+(fi+1)+':</b> '+esc(testAdvice(res[fi]))+'</p>'+(cur.tries>=3?'<p>Sample solution:</p><pre><code>'+esc(c.solution)+'</code></pre>':'')+'</div>';
}

window.__sfTest={testAdvice:testAdvice,failHtml:function(r,c){cur=cur||{tries:0};return failHtml(r,c)},csv:questionsCsv,fcode:friendCode};
applyA11y();size();if(location.hash==="#selftest")selfTest();else home();
})();
</script>
