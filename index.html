add("py",0,L("Strings in Depth","The label printer needs names cleaned up, split and joined.",
 `<p>Strings are <b>immutable</b>: a string method returns a new string and leaves the original alone.</p>
<pre>s = "  Ship it today  "
s.strip()               # "Ship it today"
s.lower()               # "  ship it today  "
"a,b,c".split(",")      # ["a", "b", "c"]
"-".join(["a", "b"])    # "a-b"
"cat".replace("c", "b") # "bat"
"ship" in "ship it"     # True</pre>
<p><b>Slicing</b> uses <code>s[start:stop:step]</code>. The stop index is not included, so <code>"python"[1:4]</code> is <code>"yth"</code>, and <code>"python"[::-1]</code> reverses the string. Escape sequences such as <code>\\n</code> (new line) and <code>\\t</code> (tab) go inside quotes.</p>
<p><code>split()</code> with no argument splits on any whitespace and ignores extra spaces, which makes it ideal for counting words.</p>`,
 [mc(`What does <code>"a,b,c".split(",")</code> return?`,[`["a", "b", "c"]`,`"abc"`,`["a,b,c"]`,"3"],0,"split cuts the string at each comma and returns a list of the pieces."),
  mc("After <code>s = \"ship\"</code> and <code>s.upper()</code>, what is <code>s</code>?",[`"SHIP"`,`"ship"`,"An error","None"],1,"Strings are immutable. upper() returns a new string and s is unchanged."),
  ty(`What is <code>"python"[1:4]</code>? Type the result without quotes.`,["yth"],"Index 1 is y, index 3 is h, and the stop index 4 is not included.")],
 {code:{prompt:`Write <code>count_words(text)</code> that returns how many words are in the text. Words are separated by whitespace, and extra spaces do not count.`,starter:"def count_words(text):\n    pass\n",
  tests:[{run:`print(count_words("Ship it today"))`,expect:"3"},{run:`print(count_words(""))`,expect:"0"},{run:`print(count_words("  a   b "))`,expect:"2"}],hint:"text.split() with no argument ignores extra whitespace. Then take the length of the list.",solution:"def count_words(text):\n    return len(text.split())"}}));

add("py",0,L("Putting It Together","Combine variables, decisions and loops into your first real mini-programs.",
 `<p>Python treats some values as <b>falsy</b>: <code>0</code>, <code>0.0</code>, <code>""</code>, <code>[]</code>, <code>{}</code>, <code>None</code> and <code>False</code>. Everything else is truthy, so <code>if items:</code> means "if the list is not empty".</p>
<p><b>Accumulator pattern</b>: start with an empty result and update it inside a loop.</p>
<pre>total = 0
for n in [4, 8, 15]:
    total = total + n      # total is now 27</pre>
<p><code>range(start, stop, step)</code> counts with a step: <code>range(2, 10, 3)</code> gives 2, 5, 8. A <code>while True:</code> loop runs until something calls <code>break</code>. The modulo operator tests divisibility: <code>n % 3 == 0</code> is true when n divides evenly by 3.</p>`,
 [mc("What does <code>bool([])</code> return?",["True","False","None","An error"],1,"An empty list is falsy."),
  mc("Which numbers does <code>range(2, 10, 3)</code> produce?",["2, 5, 8","2, 3, 4","3, 6, 9","2, 5, 8, 10"],0,"It starts at 2 and adds 3 each time, stopping before 10."),
  mc("A <code>while True:</code> loop with no <code>break</code> or <code>return</code>…",["Runs once","Runs forever","Raises an error","Skips its body"],1,"The condition is always true, so something inside must stop it.")],
 {code:{prompt:`Classic warm-up. Write <code>fizz(n)</code>: return <code>"FizzBuzz"</code> if n divides by both 3 and 5, <code>"Fizz"</code> if it divides by 3, <code>"Buzz"</code> if it divides by 5, otherwise the number as text (<code>str(n)</code>).`,starter:"def fizz(n):\n    pass\n",
  tests:[{run:"print(fizz(3))",expect:"Fizz"},{run:"print(fizz(5))",expect:"Buzz"},{run:"print(fizz(15))",expect:"FizzBuzz"},{run:"print(fizz(7))",expect:"7"}],hint:"Test the 'both' case first, because 15 also divides by 3 and by 5.",solution:`def fizz(n):\n    if n % 15 == 0:\n        return "FizzBuzz"\n    elif n % 3 == 0:\n        return "Fizz"\n    elif n % 5 == 0:\n        return "Buzz"\n    return str(n)`}}));

add("py",1,L("Text Patterns with Regex","Pull order numbers and phone numbers out of messy customer emails.",
 `<p>A <b>regular expression</b> describes a text pattern. Python's <code>re</code> module runs it. Use raw strings (<code>r"..."</code>) so backslashes reach the regex engine untouched.</p>
<pre>import re
re.search(r"\\d+", "order 4521 shipped")     # first match, or None
re.findall(r"\\d+", "a1 b22 c333")           # ['1', '22', '333']
re.sub(r"\\s+", " ", "too    many   spaces") # "too many spaces"
m = re.search(r"(\\w+)@(\\w+)\\.com", "mail bo@acme.com")
m.group(1)                                   # "bo"</pre>
<p>Building blocks: <code>\\d</code> a digit, <code>\\w</code> a word character, <code>\\s</code> whitespace, <code>.</code> any character, <code>+</code> one or more, <code>*</code> zero or more, <code>?</code> optional, <code>[abc]</code> a set, <code>^</code> start of text, <code>$</code> end of text, <code>( )</code> a capture group.</p>`,
 [mc("What does the pattern <code>\\d+</code> match?",["One or more digits","Exactly one letter","Any whitespace","The text \\d+"],0,"\\d is a digit and + means one or more."),
  ty("Which <code>re</code> function returns every non-overlapping match as a list? Type the function name.",["findall","re.findall"],"re.findall returns a list of all matches."),
  mc("In a regex, <code>^</code> placed at the start of a pattern means…",["Match the start of the text","Match any character","Negate the match","Match a literal caret"],0,"^ anchors the match to the beginning.")]));

add("py",1,L("Lambdas, Sorting and Functional Tools","Sort parcels by weight and filter the delayed ones in a single line each.",
 `<p>A <b>lambda</b> is a tiny unnamed function: <code>lambda x: x * 2</code>. It shines as a <code>key=</code> argument.</p>
<pre>parcels = [{"id": 1, "kg": 5}, {"id": 2, "kg": 2}]
sorted(parcels, key=lambda p: p["kg"])                 # lightest first
sorted(parcels, key=lambda p: p["kg"], reverse=True)   # heaviest first
max(parcels, key=lambda p: p["kg"])
list(map(lambda x: x * 2, [1, 2, 3]))      # [2, 4, 6]
list(filter(lambda x: x &gt; 1, [1, 2, 3]))  # [2, 3]</pre>
<p><code>any(items)</code> is true if at least one item is truthy, and <code>all(items)</code> is true if every one is. <code>all([])</code> is <code>True</code> and <code>any([])</code> is <code>False</code>. Comprehensions are often clearer than map and filter, so use whichever reads better.</p>`,
 [mc("What does <code>list(map(lambda x: x * 2, [1, 2]))</code> return?",["[1, 2]","[2, 4]","[1, 4]","[2, 2]"],1,"map applies the lambda to each item."),
  mc("What does <code>all([])</code> return?",["True","False","None","An error"],0,"With no items there is nothing false, so all() is true."),
  mc("What is the <code>key</code> argument of <code>sorted</code> for?",["To choose what value each item is compared by","To encrypt the list","To limit the list length","To reverse it"],0,"The key function is called on each item to produce its sort value.")],
 {code:{prompt:`Write <code>sort_by_weight(parcels, heaviest_first=False)</code>. Each parcel is a dictionary with a <code>"kg"</code> key. Return a new list sorted by weight. By default the lightest comes first.`,starter:"def sort_by_weight(parcels, heaviest_first=False):\n    pass\n",
  tests:[{run:`P = [{"id": 1, "kg": 5}, {"id": 2, "kg": 2}, {"id": 3, "kg": 9}]\nprint([p["id"] for p in sort_by_weight(P)])`,expect:"[2, 1, 3]"},{run:`P = [{"id": 1, "kg": 5}, {"id": 2, "kg": 2}, {"id": 3, "kg": 9}]\nprint([p["id"] for p in sort_by_weight(P, True)])`,expect:"[3, 1, 2]"},{run:"print(sort_by_weight([]))",expect:"[]"}],hint:'Use sorted() with key=lambda p: p["kg"] and pass reverse=heaviest_first.',solution:`def sort_by_weight(parcels, heaviest_first=False):\n    return sorted(parcels, key=lambda p: p["kg"], reverse=heaviest_first)`}}));

add("py",1,L("Debugging and Testing","The nightly script crashed at 2 AM. Read the evidence before changing anything.",
 `<p>A <b>traceback</b> is a map to the bug. Read it from the bottom: the last line names the error and message, and the lines above show the chain of calls that led there.</p>
<ul><li><code>NameError</code>: a name that does not exist. <code>TypeError</code>: wrong kind of value. <code>ValueError</code>: right kind, bad value. <code>IndexError</code> and <code>KeyError</code>: a missing position or key. <code>AttributeError</code>: the object has no such attribute.</li></ul>
<p>Debugging routine: reproduce the problem, shrink it to the smallest failing input, form a guess, check it with a <code>print()</code>, <code>logging</code> or the debugger (<code>breakpoint()</code> opens <code>pdb</code>), fix one thing, rerun.</p>
<pre>def test_total():
    assert total(2, 3) == 6, "2 x 3 should be 6"</pre>
<p><code>assert</code> raises <code>AssertionError</code> when its condition is false. A test is a small function that asserts what the code should do, and a test suite protects you from breaking things later.</p>`,
 [mc("Which line of a traceback tells you the actual error type and message?",["The first line","The last line","Any line with a file name","The blank line"],1,"The final line holds the exception and its message."),
  mc("Which error does <code>[1, 2][5]</code> raise?",["KeyError","IndexError","TypeError","NameError"],1,"The position 5 does not exist in a two-item list."),
  mc("<code>assert x &gt; 0</code> does what when x is -1?",["Nothing","Raises AssertionError","Prints False","Sets x to 0"],1,"A failed assert raises an AssertionError.")]));

add("py",2,L("The Python Data Model","A shared list is silently growing between requests. Find out why.",
 `<p>In Python, a variable is a <b>name that points to an object</b>. Assignment copies the pointer, not the object.</p>
<pre>a = [1, 2]
b = a          # same list, two names
b.append(3)
print(a)       # [1, 2, 3]
c = a.copy()   # a new, independent (shallow) copy</pre>
<p><code>==</code> asks whether values are equal. <code>is</code> asks whether two names point at the very same object. <code>copy.deepcopy</code> also copies nested objects.</p>
<p><b>Mutable default trap</b>: a default value is created once, when the function is defined, so a default list is shared by every call.</p>
<pre>def add(item, bucket=[]):   # bug: one shared list
    bucket.append(item)
    return bucket

def add(item, bucket=None): # fix
    if bucket is None:
        bucket = []
    bucket.append(item)
    return bucket</pre>
<p>CPython frees objects mainly by <b>reference counting</b>, with a cycle collector for loops of references.</p>`,
 [mc("After <code>a = [1, 2]; b = a; b.append(3)</code>, what is <code>a</code>?",["[1, 2]","[1, 2, 3]","[3]","An error"],1,"Both names point to the same list object."),
  mc("Which operator checks that two names refer to the same object?",["==","is","=","in"],1,"is compares identity. == compares values."),
  mc("Why is <code>def f(x, items=[])</code> risky?",["Lists cannot be defaults","The default list is created once and shared between calls","It is a syntax error","It makes f slower"],1,"State leaks from one call into the next.")],
 {code:{prompt:`This function has the classic mutable-default bug. Fix <code>add_item(item, bucket=None)</code> so each call without a bucket starts a fresh list, and a bucket you pass in is extended and returned.`,starter:"def add_item(item, bucket=[]):\n    bucket.append(item)\n    return bucket\n",
  tests:[{run:"print(add_item(1))\nprint(add_item(2))",expect:"[1]\n[2]"},{run:"x = [9]\nprint(add_item(1, x))",expect:"[9, 1]"},{run:"add_item(5)\nprint(add_item(6))",expect:"[6]"}],hint:"Use None as the default, then create a new list inside the function when bucket is None.",solution:"def add_item(item, bucket=None):\n    if bucket is None:\n        bucket = []\n    bucket.append(item)\n    return bucket"}}));

add("py",2,L("Protocols, Iterators and Context Managers","Make your own objects work with for loops and with statements.",
 `<p>Python is built on <b>protocols</b>: if an object has the right methods, the language treats it accordingly. This is <b>duck typing</b>: "if it walks like a duck".</p>
<ul><li><b>Iterator protocol</b>: <code>__iter__</code> returns the iterator, and <code>__next__</code> returns the next value or raises <code>StopIteration</code> when finished.</li>
<li><b>Context manager protocol</b>: <code>__enter__</code> runs on entry, and <code>__exit__</code> always runs on the way out, even after an exception.</li></ul>
<pre>class Countdown:
    def __init__(self, start):
        self.n = start
    def __iter__(self):
        return self
    def __next__(self):
        if self.n &lt;= 0:
            raise StopIteration
        self.n -= 1
        return self.n + 1</pre>
<p><b>Abstract base classes</b> (<code>abc.ABC</code>) declare methods that subclasses must implement. <code>typing.Protocol</code> describes structure for type checkers without inheritance.</p>`,
 [mc("Which exception signals that an iterator has no more values?",["EOFError","StopIteration","IndexError","ValueError"],1,"A for loop stops quietly when it sees StopIteration."),
  mc("When does <code>__exit__</code> of a context manager run?",["Only if no error occurred","Whenever the with block ends, even after an error","Only on success","Never automatically"],1,"That guarantee is the whole point of context managers."),
  mc("Duck typing means…",["Objects must inherit from a specific class","What an object can do matters more than its declared type","Variables need type declarations","Only birds are allowed"],1,"If it provides the needed methods, it works.")],
 {code:{prompt:`Write a class <code>Countdown(start)</code> that is an iterator. Looping over <code>Countdown(3)</code> gives 3, 2, 1 and then stops.`,starter:"class Countdown:\n    def __init__(self, start):\n        pass\n\n    def __iter__(self):\n        pass\n\n    def __next__(self):\n        pass\n",
  tests:[{run:"print(list(Countdown(3)))",expect:"[3, 2, 1]"},{run:"print(list(Countdown(0)))",expect:"[]"},{run:"c = Countdown(2)\nprint(next(c))\nprint(next(c))",expect:"2\n1"}],hint:"__iter__ returns self. __next__ raises StopIteration when the counter reaches 0, otherwise it returns the current value and then decreases it.",solution:"class Countdown:\n    def __init__(self, start):\n        self.n = start\n\n    def __iter__(self):\n        return self\n\n    def __next__(self):\n        if self.n <= 0:\n            raise StopIteration\n        v = self.n\n        self.n -= 1\n        return v"}}));

add("py",2,L("Python in the Real World","Ship the tracker as a small service with a database behind it.",
 `<ul><li><b>HTTP and APIs</b>: the <code>requests</code> library calls web APIs. <code>GET</code> reads, <code>POST</code> creates, <code>PUT</code> or <code>PATCH</code> updates, <code>DELETE</code> removes. Responses carry a status code and, often, JSON.</li>
<li><b>Web frameworks</b>: Flask and FastAPI turn functions into endpoints. FastAPI also validates input from type hints.</li>
<li><b>Databases</b>: <code>sqlite3</code> ships with Python. Always pass values as parameters (<code>cur.execute("... WHERE id = ?", (id,))</code>), never by pasting strings into SQL.</li>
<li><b>Data work</b>: <code>pandas</code> handles tables, with <code>read_csv</code>, filtering, grouping and joins.</li>
<li><b>Configuration and secrets</b>: read them from environment variables or a secrets manager, never from source code.</li>
<li><b>Shipping</b>: describe the project in <code>pyproject.toml</code>, pin dependencies, run tests in CI, and package the app in a container.</li></ul>`,
 [mc("Where should an API key be stored?",["Hard-coded in the source file","In an environment variable or a secrets manager","In a public repository","In a comment"],1,"Secrets in source code leak through version control."),
  mc("Which HTTP method normally reads data without changing it?",["GET","POST","DELETE","PUT"],0,"GET is meant to be safe and repeatable."),
  ty("Which database module is built into Python's standard library? Type its name.",["sqlite3","sqlite"],"sqlite3 gives you a full SQL database in a single file.")]));

add("ai",0,L("How Computers See and Read","A phone app must tell cats from dogs, read receipts and transcribe voice notes. Everything starts as numbers.",
 `<p>Models only understand numbers, so every kind of data is converted first.</p>
<ul><li><b>Images</b> are grids of <b>pixels</b>. A color pixel is three numbers (red, green, blue), each 0 to 255. A 224 by 224 color image is 224 x 224 x 3 numbers.</li>
<li><b>Text</b> is split into <b>tokens</b> (words or word pieces). Each token gets an ID, then an <b>embedding</b>: a list of numbers where similar meanings land close together.</li>
<li><b>Audio</b> is a wave sampled thousands of times per second, often turned into a <b>spectrogram</b> (frequency over time) before a model reads it.</li></ul>
<p>Once data is numeric, the same learning ideas apply to all of it. This is why one family of methods can handle pictures, language and sound.</p>`,
 [ty("How many numbers describe a 224 by 224 color (RGB) image? Type the number.",["150528","150,528"],"224 x 224 x 3 = 150,528."),
  mc("A token is…",["A piece of text such as a word or word fragment","A password","A type of image filter","A GPU"],0,"Models read text as sequences of tokens."),
  mc("Embeddings are useful because…",["They compress files","Similar meanings end up as nearby vectors","They encrypt data","They label images"],1,"Distance between vectors reflects similarity.")]));

add("ai",0,L("Using AI Tools Well","Your team starts using an AI assistant. Learn the habits that keep the results trustworthy.",
 `<p>A good request has four parts: the <b>task</b>, the <b>context</b>, the <b>format</b> you want, and an <b>example</b> if the style matters. Vague in, vague out.</p>
<ul><li><b>Iterate</b>: treat the first answer as a draft and refine it.</li>
<li><b>Verify</b>: check facts, numbers, quotes and links. Assistants can sound sure while being wrong.</li>
<li><b>Mind privacy</b>: do not paste passwords, customer data or confidential documents into tools your organization has not approved.</li>
<li><b>Know the limits</b>: models have a knowledge cutoff, can miss recent events, and can reflect bias in their training data.</li>
<li><b>Stay accountable</b>: you own the result you send or ship, not the tool.</li></ul>`,
 [mc("Which request is likely to get the best result?",["Write something about sales","Summarize this Q3 sales report in 5 bullets for executives, focusing on risks","Do my job","Sales"],1,"It states the task, audience, format and focus."),
  mc("An assistant gives a surprisingly specific statistic with no source. You should…",["Trust it because it sounds confident","Verify it with a reliable source before using it","Share it immediately","Ignore all AI output forever"],1,"Confident wording is not evidence."),
  mc("Which data should you avoid pasting into an unapproved AI tool?",["A public recipe","Customer records and passwords","A general question about Python","A famous poem"],1,"Sensitive data can leave your control.")]));

add("ai",1,L("Unsupervised Learning in Practice","Marketing wants customer segments, and nobody has labels.",
 `<ul><li><b>Clustering</b>: k-means assigns each point to its nearest center, moves each center to the average of its points, and repeats. You choose <b>k</b>. The <b>elbow method</b> and <b>silhouette score</b> help pick it. Always scale features first, because distance is sensitive to units.</li>
<li><b>Hierarchical clustering</b> builds a tree of groups, so you can cut it at any level.</li>
<li><b>Dimensionality reduction</b>: <b>PCA</b> finds the directions that keep the most variation, so you can compress many features into a few or plot them in 2D.</li>
<li><b>Anomaly detection</b> flags points that do not fit the usual pattern, such as fraud or faulty sensors.</li></ul>
<p>Unsupervised results are judged by whether they are useful and make sense to people, not by an accuracy number.</p>`,
 [mc("In k-means, what do you have to choose before training?",["The labels","The number of clusters k","The test set","The activation function"],1,"The algorithm needs k up front."),
  mc("PCA is mainly used to…",["Predict labels","Reduce the number of features while keeping most variation","Generate text","Clean typos"],1,"It projects data onto fewer, informative directions."),
  mc("Why scale features before k-means?",["Distances would be dominated by features with large units","It makes labels appear","It removes outliers","It is required to import the library"],0,"Without scaling, income in dollars would swamp age in years.")],
 {code:{prompt:`The assignment step of k-means. Write <code>nearest(x, centers)</code> that returns the index of the center closest to <code>x</code> (numbers on a line).`,starter:"def nearest(x, centers):\n    pass\n",
  tests:[{run:"print(nearest(6, [0, 10]))",expect:"1"},{run:"print(nearest(4.9, [0, 10]))",expect:"0"},{run:"print(nearest(1, [5, 1, 9]))",expect:"1"}],hint:"Loop over the indexes, track the smallest abs(x - center) so far and the index where it happened.",solution:"def nearest(x, centers):\n    best = 0\n    for i in range(len(centers)):\n        if abs(x - centers[i]) < abs(x - centers[best]):\n            best = i\n    return best"}}));

add("ai",1,L("Taming Overfitting","The model is brilliant on training data and mediocre in the real world.",
 `<p><b>Bias</b> is error from a model that is too simple. <b>Variance</b> is error from a model that is too sensitive to the training set. You want a balance, and these are the main controls:</p>
<ul><li><b>More and better data</b>, and <b>data augmentation</b> (flip, crop or noise images).</li>
<li><b>Regularization</b>: <b>L2</b> penalizes large weights, and <b>L1</b> pushes some weights to exactly zero.</li>
<li><b>Dropout</b>: randomly switch off neurons during training so the network cannot lean on any one of them.</li>
<li><b>Early stopping</b>: stop training when validation loss starts to rise.</li>
<li><b>Simpler models</b> or fewer features.</li></ul>
<p><b>Hyperparameters</b> are settings you choose before training (learning rate, tree depth, k). Tune them with <b>grid search</b> or <b>random search</b> on the validation data, never on the test set. <b>Learning curves</b> (error against training size) show whether you need more data or a better model.</p>`,
 [mc("L2 regularization works by…",["Deleting rows","Penalizing large weights","Increasing the learning rate","Adding labels"],1,"A penalty on weight size keeps the model smoother."),
  mc("Early stopping halts training when…",["The first epoch ends","Validation loss stops improving and begins to rise","Training loss reaches zero","The test set is used up"],1,"Further training would only memorize the training set."),
  mc("Where should hyperparameters be tuned?",["On the test set","On the validation set or with cross-validation","On the training labels only","They cannot be tuned"],1,"The test set must stay untouched for an honest final score.")]));

add("ai",1,L("Language Basics: From Words to Vectors","Count what customers actually write in 50,000 support tickets.",
 `<ul><li><b>Tokenization</b> splits text into units. <b>Normalization</b> lowercases and strips noise.</li>
<li><b>Bag of words</b> counts how often each word appears and ignores order.</li>
<li><b>TF-IDF</b> weights words by how special they are: common words like "the" get low weight, distinctive words get high weight.</li>
<li><b>Word embeddings</b> (word2vec and similar) give each word a dense vector learned from context, so "doctor" lands near "nurse".</li>
<li><b>Sequence models</b> (RNNs, LSTMs) read words one after another. They were largely replaced by transformers, which read the whole sequence with attention.</li>
<li>Typical tasks: sentiment analysis, topic classification, named entity recognition and translation.</li></ul>`,
 [mc("TF-IDF gives a low weight to…",["Rare, distinctive words","Words that appear in almost every document","Numbers","Nouns"],1,"Common words carry little information about a specific document."),
  mc("A bag-of-words model ignores…",["Word counts","Word order","Spelling","Document length"],1,"It only keeps how many times each word occurs."),
  mc("A word embedding is…",["A dense vector that captures how a word is used","A dictionary definition","A grammar rule","A compressed file"],0,"Words used in similar contexts get similar vectors.")],
 {code:{prompt:`Write <code>bag_of_words(text)</code> that returns a dictionary mapping each lowercase word to how many times it appears. Words are separated by whitespace.`,starter:"def bag_of_words(text):\n    pass\n",
  tests:[{run:`d = bag_of_words("the cat the hat")\nprint(d["the"])`,expect:"2"},{run:`d = bag_of_words("the cat the hat")\nprint(d["cat"])`,expect:"1"},{run:`d = bag_of_words("The the THE")\nprint(len(d))`,expect:"1"},{run:`print(len(bag_of_words("")))`,expect:"0"}],hint:"Lowercase the text, split it, and use a dictionary with d.get(word, 0) + 1.",solution:"def bag_of_words(text):\n    counts = {}\n    for w in text.lower().split():\n        counts[w] = counts.get(w, 0) + 1\n    return counts"}}));

add("ai",2,L("Transformers Under the Hood","Open the engine inside every modern language model.",
 `<p>A transformer turns tokens into embeddings, adds <b>positional information</b> (attention alone has no sense of order), and passes them through stacked blocks of <b>self-attention</b> and a <b>feed-forward</b> network, each wrapped with <b>residual connections</b> and <b>layer normalization</b>.</p>
<p>Attention in one line: each token makes a <b>query</b>, a <b>key</b> and a <b>value</b>. Query-key dot products give relevance scores, <b>softmax</b> turns them into weights that sum to 1, and the output is the weighted sum of the values. <b>Multi-head</b> attention runs several of these in parallel to capture different relationships.</p>
<ul><li>Decoder-only models (the GPT family) are <b>autoregressive</b>: they generate one token at a time, each conditioned on the previous ones, using a <b>causal mask</b> so they cannot see the future.</li>
<li>A <b>KV cache</b> stores earlier keys and values so each new token does not recompute them.</li></ul>`,
 [mc("Why do transformers add positional information?",["Attention by itself does not know word order","To shrink the model","To label classes","To avoid softmax"],0,"Without it, shuffling the words would look identical."),
  mc("Softmax in attention turns scores into…",["Weights that sum to 1","Images","Embeddings","Random numbers"],0,"The weights say how much to read from each token."),
  mc("A KV cache speeds up generation by…",["Reusing earlier keys and values instead of recomputing them","Shrinking the vocabulary","Skipping attention","Using more GPUs"],0,"Each new token only needs its own new key and value.")],
 {code:{prompt:`Implement softmax in plain Python. Write <code>softmax(xs)</code> that returns a list of probabilities: <code>exp(x)</code> for each value divided by the sum of all of them. Use <code>import math</code>.`,starter:"import math\n\ndef softmax(xs):\n    pass\n",
  tests:[{run:"print(abs(sum(softmax([1, 2, 3])) - 1) < 0.000000001)",expect:"True"},{run:"print(softmax([0, 0]))",expect:"[0.5, 0.5]"},{run:"p = softmax([1, 2, 3])\nprint(p.index(max(p)))",expect:"2"}],hint:"Compute the exponentials in a list, add them up, then divide each by the total.",solution:"import math\n\ndef softmax(xs):\n    e = [math.exp(x) for x in xs]\n    total = sum(e)\n    return [v / total for v in e]"}}));

add("ai",2,L("Fine-Tuning, Alignment and Evaluation","The base model is capable but not yet helpful or safe. Shape it, then measure it honestly.",
 `<ul><li><b>Supervised fine-tuning (SFT)</b> trains a pretrained model on examples of the behavior you want.</li>
<li><b>Parameter-efficient tuning</b> such as <b>LoRA</b> trains small adapter matrices instead of all weights, which cuts cost and memory.</li>
<li><b>Preference tuning</b>: <b>RLHF</b> learns a reward signal from human comparisons of answers, then optimizes against it. <b>DPO</b> reaches a similar goal directly from preference pairs.</li>
<li><b>Distillation</b> trains a small model to imitate a large one.</li></ul>
<p><b>Evaluation</b> needs several lenses: benchmarks, task-specific test sets, human review and carefully validated model-as-judge scoring. Watch for <b>benchmark contamination</b>, when test questions leaked into training data and scores look better than real ability. Evaluate for safety and bias too, and re-run evaluations whenever the model, prompt or data changes.</p>`,
 [mc("LoRA fine-tuning…",["Trains small adapter matrices instead of every weight","Deletes layers","Needs no data","Replaces the tokenizer"],0,"It is a cheaper way to specialize a large model."),
  mc("RLHF uses…",["Human preference comparisons to guide the model","Random rewards","Only labeled images","No feedback"],0,"People rank outputs, and that signal steers training."),
  mc("Benchmark contamination is…",["A GPU overheating","Test questions appearing in the training data","Noisy images","A deployment bug"],1,"The model may have memorized answers, inflating its score.")]));

add("ai",2,L("Building LLM Applications","Ship a support assistant that answers from the company's own documents.",
 `<p>A typical <b>RAG</b> pipeline: <b>chunk</b> documents into passages, create an <b>embedding</b> of each, store them in a <b>vector index</b>, embed the user's question, retrieve the closest passages, optionally <b>rerank</b> them, and put them in the prompt with an instruction to answer from the sources only.</p>
<ul><li><b>Structured output</b>: ask for JSON that matches a schema and validate it.</li>
<li><b>Tool (function) calling</b>: the model replies with a structured request, your code runs the tool, and the result goes back to the model. The model never executes anything itself.</li>
<li><b>Cost and latency</b> scale with tokens: trim context, cache repeated prompts and pick the smallest model that passes your evaluations.</li>
<li><b>Guardrails</b>: input and output checks, permissions for tools, human approval for risky actions and logging.</li>
<li><b>Evaluate in production</b>: sample real conversations, track failures and feed them back into your test set.</li></ul>`,
 [mc("Why split documents into chunks before embedding?",["So retrieval can return small, relevant passages","To encrypt them","To lower the temperature","To train the tokenizer"],0,"A whole book as one vector would be too coarse to match a question."),
  mc("In tool calling, who actually runs the tool?",["The model itself","Your application code","The user's browser only","The GPU"],1,"The model proposes a call and your code decides whether to execute it."),
  mc("A good way to reduce cost and latency is to…",["Send the whole database in every prompt","Trim context and cache repeated work","Raise the temperature","Disable evaluations"],1,"Fewer tokens means faster and cheaper calls.")]));

/* ---------- CYBERSECURITY ---------- */
add("cy",0,L("Know Your Malware","An employee's laptop is behaving strangely. Learn the cast of villains.",
 `<ul><li><b>Virus</b>: attaches to a file and spreads when that file is run. <b>Worm</b>: spreads by itself across networks. <b>Trojan</b>: pretends to be useful software.</li>
<li><b>Ransomware</b>: encrypts files and demands payment. <b>Spyware</b> and <b>keyloggers</b> record what you do. <b>Rootkits</b> hide deep in the system. <b>Botnets</b> are armies of infected machines controlled remotely.</li>
<li><b>Infostealers</b> grab saved passwords, cookies and tokens.</li></ul>
<p>Defenses that work: keep systems patched, run endpoint protection (antivirus or <b>EDR</b>), avoid enabling macros in unexpected documents, use standard (non-admin) accounts, keep offline backups and download software only from trusted sources.</p>`,
 [mc("Malware that spreads on its own from machine to machine is a…",["Worm","Trojan","Keylogger","Adware"],0,"Worms do not need a user to run a host file."),
  mc("A program that pretends to be a useful tool but hides malicious behavior is a…",["Trojan","Worm","Firewall","Patch"],0,"The name comes from the Trojan horse."),
  mc("Which habit best limits damage from ransomware?",["Offline or immutable backups that are tested","Paying quickly","Disabling updates","Sharing admin passwords"],0,"With good backups you can restore without paying.")]));

add("cy",0,L("Privacy and Safe Browsing","A colleague asks what is actually safe to do online.",
 `<ul><li>The padlock in your browser means the connection is <b>encrypted</b>. It does not mean the site is honest, since scam sites can have padlocks too.</li>
<li><b>Cookies</b> remember you. <b>Trackers</b> follow you across sites. Browser privacy settings and blockers reduce this.</li>
<li>A <b>VPN</b> hides your traffic from the local network and your address from the sites, but the VPN provider can see it, so it is not magic anonymity.</li>
<li>Check app <b>permissions</b> and grant only what an app needs.</li>
<li>Use a <b>password manager</b> and a unique password per site. If a site is breached, only that one password is exposed. Services such as Have I Been Pwned show whether your email appeared in a known breach.</li>
<li>Think before you post: birthdays, schools and travel plans help attackers guess security answers and plan scams.</li></ul>`,
 [mc("The padlock icon in a browser means…",["The site is guaranteed trustworthy","The connection to the site is encrypted","The site has no ads","The site is government-approved"],1,"It describes the connection, not the honesty of the owner."),
  mc("What is true about using a VPN?",["It makes you completely anonymous","It shifts who can see your traffic to the VPN provider","It removes all malware","It speeds up every site"],1,"You trade trust in your network for trust in the provider."),
  mc("Why use a unique password for every site?",["A breach of one site does not expose your other accounts","Sites require it by law","It makes pages load faster","It removes the need for MFA"],0,"Reuse is what makes credential stuffing work.")]));

add("cy",1,L("Identity and Access Management","Harbor Credit Union has 400 employees, 60 apps and a lot of accounts nobody owns.",
 `<ul><li><b>Authentication</b> proves who you are. <b>Authorization</b> decides what you may do.</li>
<li><b>RBAC</b> (role-based access control) grants permissions to roles such as "teller" or "auditor", then people get roles. It is easier to review than permissions per person.</li>
<li><b>SSO</b> lets one secure login open many apps. <b>SAML</b> and <b>OpenID Connect</b> carry identity between systems. <b>OAuth 2.0</b> delegates limited access ("let this app read my calendar") without sharing a password.</li>
<li><b>Joiner, mover, leaver</b>: grant access when someone joins, adjust it when they change roles, and remove it immediately when they leave. Review access regularly.</li>
<li><b>Privileged accounts</b> need extra protection: separate admin accounts, just-in-time elevation and session logging.</li>
<li><b>MFA fatigue</b> attacks spam push approvals. Prefer number matching and phishing-resistant methods such as passkeys or hardware keys.</li></ul>`,
 [mc("Authorization answers which question?",["Who are you?","What are you allowed to do?","Where is the server?","Is the data encrypted?"],1,"Authentication is identity, authorization is permission."),
  mc("What is the benefit of RBAC?",["Permissions are managed through roles and are easier to review","Passwords never expire","No logging is needed","Everyone becomes admin"],0,"You review a few roles instead of thousands of individual grants."),
  mc("An employee leaves the company. Their access should be…",["Kept for 6 months","Removed promptly as part of the leaver process","Moved to a coworker silently","Left until the audit"],1,"Orphaned accounts are a common source of breaches.")]));

add("cy",1,L("Vulnerability Management","Four thousand scanner findings and one patch window. Decide what comes first.",
 `<ul><li>A <b>CVE</b> is a public identifier for a known vulnerability, for example CVE-2021-44228. <b>CVSS</b> scores its technical severity from 0 to 10.</li>
<li>Severity alone is not priority. Weigh <b>exploitability</b> (is it being attacked now? CISA's <b>KEV catalog</b> lists vulnerabilities known to be exploited in the wild), <b>exposure</b> (internet-facing?) and <b>asset value</b> (what does the system hold?).</li>
<li>The cycle: <b>discover assets, scan, prioritize, remediate, verify, report</b>, then repeat. You cannot protect what you do not know you have.</li>
<li>A <b>false positive</b> is a reported flaw that is not really there. A <b>false negative</b> is a real flaw the scanner missed.</li>
<li>When a patch is not possible, use <b>compensating controls</b>: isolate the system, restrict access or add monitoring.</li></ul>`,
 [mc("A CVE is…",["A public identifier for a disclosed vulnerability","A type of malware","A firewall rule","A password policy"],0,"It gives everyone a common name for the same flaw."),
  mc("Which finding should usually be patched first?",["A medium flaw on an isolated test box","A high flaw on an internet-facing server that is known to be exploited","A low flaw on a printer","Whichever is alphabetically first"],1,"Active exploitation plus exposure beats raw score."),
  mc("A false positive is…",["A flaw the scanner reports that is not actually present","A real flaw the scanner missed","A successful attack","A patched server"],0,"Verify findings before spending effort on them.")]));

add("cy",1,L("Security Monitoring and the SIEM","The SOC sees 10,000 alerts a day. Turn noise into signals.",
 `<ul><li>A <b>SIEM</b> collects logs from servers, firewalls, identity systems and cloud services, normalizes them, and lets you search, correlate and alert.</li>
<li>Good <b>detection rules</b> describe attacker behavior, such as 50 failed logins followed by a success, or a login from two countries within an hour.</li>
<li>Build a <b>baseline</b> of normal activity first. Unusual means different from normal for this system.</li>
<li><b>Alert fatigue</b> is when too many false alarms hide real ones. Tune rules, suppress known noise and measure precision.</li>
<li>A typical <b>SOC</b> splits work in tiers: tier 1 triages alerts, tier 2 investigates, tier 3 hunts and engineers detections. <b>EDR</b> on endpoints and <b>NDR</b> on networks add visibility.</li>
<li>Time-sync every system (NTP) so events line up across logs.</li></ul>`,
 [mc("What does a SIEM do?",["Collects and correlates logs from many systems","Writes application code","Replaces the firewall","Backs up databases"],0,"Centralized, searchable logs are the foundation of detection."),
  mc("Alert fatigue happens when…",["Analysts work too few hours","Too many low-value alerts bury the real ones","Logs are encrypted","The SIEM is too fast"],1,"Tuning rules is how you keep signals visible."),
  mc("Why must systems have synchronized clocks?",["So timelines from different logs can be correlated","To save disk space","To speed up Wi-Fi","To enable HTTPS"],0,"Without a shared time, reconstructing an incident is guesswork.")]));

add("cy",2,L("Securing Enterprise Identity (Active Directory)","Most corporate networks run on Active Directory. Learn where it breaks so you can harden it.",
 `<p><b>Active Directory (AD)</b> is the directory that holds users, computers and groups, and <b>domain controllers</b> authenticate them, mostly using <b>Kerberos</b>. Whoever controls a domain controller or a domain admin account controls the whole organization, so attackers aim for it.</p>
<p>Common weaknesses, and the defense for each:</p>
<ul><li>Service accounts with weak passwords can be cracked offline after a ticket request (<b>Kerberoasting</b>). Use long random passwords or <b>group managed service accounts (gMSA)</b>.</li>
<li>Shared local administrator passwords let one stolen password open many machines. Use <b>LAPS</b> to randomize them.</li>
<li>Domain admins logging into ordinary workstations leave credentials behind. Use a <b>tiered admin model</b> and privileged access workstations.</li>
<li>Over-permissioned groups and stale accounts: review membership and remove what is unused.</li>
<li>Monitor sensitive events: changes to privileged groups, new Kerberos ticket anomalies and logons from unusual hosts.</li></ul>`,
 [mc("Why are domain controllers the highest-value target in an AD environment?",["They hold the credentials and authentication control for the whole domain","They have the most RAM","They host the website","They are always on Wi-Fi"],0,"Control of a DC means control of every domain account."),
  mc("Which control reduces the risk of reused local administrator passwords?",["LAPS, which gives each machine a unique random password","Longer screen timeouts","A bigger firewall","More antivirus pop-ups"],0,"One stolen password then opens only one machine."),
  mc("In a tiered admin model, domain admin accounts should…",["Log in to any workstation for convenience","Be used only on protected, dedicated systems","Be shared by the team","Never be monitored"],1,"Keeping high-privilege credentials off low-trust machines stops credential theft from spreading.")]));

add("cy",2,L("Application Security and the Secure SDLC","Build security into the software before it reaches a penetration tester.",
 `<ul><li><b>Threat modeling</b> asks what we are building, what can go wrong and what we will do about it. <b>STRIDE</b> lists the categories: Spoofing, Tampering, Repudiation, Information disclosure, Denial of service and Elevation of privilege.</li>
<li><b>SAST</b> analyzes source code without running it. <b>DAST</b> tests a running application from the outside. <b>SCA</b> checks third-party dependencies for known flaws. <b>Secret scanning</b> catches keys committed by mistake.</li>
<li>Code review with a security checklist, <b>secure defaults</b> and input validation on the server side.</li>
<li><b>Supply chain</b>: pin and verify dependencies, generate an SBOM and protect the build pipeline, since an attacker in the pipeline controls what ships.</li>
<li>Fix cheap early: a flaw found at design time costs far less than one found in production. A vulnerability disclosure policy tells researchers how to report problems.</li></ul>`,
 [mc("SAST differs from DAST because it…",["Analyzes source code without running the application","Tests the running application only","Scans networks","Cracks passwords"],0,"Static means no execution."),
  mc("In STRIDE, the letter S stands for…",["Spoofing","Sanitizing","Sniffing","Scaling"],0,"Spoofing is pretending to be someone or something else."),
  mc("An API key is found committed in a public repository. What should happen first?",["Delete the commit and hope","Revoke and rotate the key immediately","Wait for the next release","Make the repository private only"],1,"Once public, assume the secret is compromised.")]));

add("cy",2,L("Governance, Risk and Compliance","The board asks one question: are we secure enough, and how do you know?",
 `<ul><li>A <b>risk register</b> lists risks with likelihood, impact, an owner and a treatment: <b>mitigate</b>, <b>transfer</b> (insurance or contract), <b>avoid</b> or <b>accept</b> with explicit sign-off.</li>
<li>A <b>business impact analysis (BIA)</b> finds which processes matter most and what an outage costs. It sets recovery goals (RTO and RPO) and feeds <b>business continuity</b> and <b>disaster recovery</b> plans.</li>
<li><b>Frameworks</b> give structure: the <b>NIST Cybersecurity Framework</b> (functions include Identify, Protect, Detect, Respond and Recover), <b>ISO/IEC 27001</b> and <b>SOC 2</b>. <b>GDPR</b> and <b>PCI DSS</b> are examples of legal or industry requirements.</li>
<li>A <b>policy</b> says what must happen, a <b>standard</b> says how, and a <b>procedure</b> gives the steps.</li>
<li>Measure what matters (time to patch, time to detect, phishing report rate) and practice with <b>tabletop exercises</b> before a real incident.</li></ul>`,
 [mc("Buying cyber insurance to cover a financial loss is which risk treatment?",["Accept","Transfer","Avoid","Ignore"],1,"The financial impact is shifted to another party."),
  mc("A business impact analysis identifies…",["Which processes are most critical and what downtime costs","Which password is weakest","Which firewall to buy","Who wrote the code"],0,"It tells you what to protect and restore first."),
  mc("Which is one of the NIST Cybersecurity Framework's core functions?",["Detect","Decorate","Delete","Dispute"],0,"Identify, Protect, Detect, Respond and Recover are core functions of the framework.")]));

/* ---------- NETWORKING AND SERVERS ---------- */
add("nw",0,L("The OSI Model","A packet leaves your laptop. Follow it down the layers and back up.",
 `<p>The <b>OSI model</b> splits networking into seven layers. It is a teaching map, and the real internet uses the simpler TCP/IP model that you met earlier.</p>
<ul><li><b>7 Application</b>: HTTP, DNS, SMTP</li><li><b>6 Presentation</b>: encoding, encryption formats</li><li><b>5 Session</b>: sessions and dialogs</li><li><b>4 Transport</b>: TCP and UDP, ports</li><li><b>3 Network</b>: IP addresses and routing</li><li><b>2 Data link</b>: MAC addresses, Ethernet frames, switches</li><li><b>1 Physical</b>: cables, radio, signals</li></ul>
<p><b>Encapsulation</b>: going down, each layer wraps the data with its own header. Application data becomes a TCP segment, then an IP packet, then an Ethernet frame, then bits on the wire. The receiver unwraps in reverse. Troubleshooters use the layers as a checklist, starting from the bottom.</p>`,
 [ty("How many layers does the OSI model have? Type the number.",["7","seven"],"The seven layers run from Physical up to Application."),
  mc("Which OSI layer deals with IP addresses and routing?",["Data link (2)","Network (3)","Transport (4)","Session (5)"],1,"Layer 3 is the Network layer."),
  mc("A switch mainly works with which layer's addresses?",["Layer 2, MAC addresses","Layer 7, domain names","Layer 4, ports only","Layer 1, voltages"],0,"Classic switches forward frames by MAC address.")]));

add("nw",0,L("Home and Small Office Networks","A five-person shop wants fast, safe internet without a full-time IT team.",
 `<ul><li>The <b>ISP modem</b> brings the connection in. The <b>router</b> shares it, runs DHCP and NAT and usually includes a switch and Wi-Fi.</li>
<li>Change the router's <b>default admin password</b>, keep its <b>firmware updated</b> and turn off remote administration from the internet unless you truly need it.</li>
<li>Use <b>WPA3</b> (or WPA2) and a long passphrase. Put visitors and smart gadgets on a separate <b>guest network</b>.</li>
<li><b>Port forwarding</b> and UPnP expose inside devices to the internet. Open only what you need.</li>
<li>Place Wi-Fi access points centrally, use wired connections for desktops and printers where possible, and consider a <b>mesh</b> system for large spaces.</li>
<li>Write down what is on the network, and keep a backup of the router configuration.</li></ul>`,
 [mc("Why put smart-home gadgets and visitors on a guest network?",["So they cannot reach your main computers and files","It makes Wi-Fi faster","It is required by ISPs","It hides the router"],0,"Isolation limits the damage from a weak device."),
  mc("What is a risk of port forwarding?",["It exposes an inside device to the internet","It lowers your bandwidth to zero","It deletes DHCP","It disables Wi-Fi"],0,"Anything you forward becomes reachable by attackers too."),
  mc("Which two habits improve router security the most?",["Change the default admin password and update the firmware","Hide the logo and add a sticker","Use channel 1 only","Restart weekly"],0,"Defaults and old firmware are the usual way in.")]));

add("nw",1,L("Subnetting in Practice","The clinic must split 192.168.1.0/24 into smaller networks for staff, guests and printers.",
 `<p>Each bit you move from the host part to the network part <b>halves</b> the subnet size. For a prefix <code>/p</code>: addresses = 2<sup>(32 - p)</sup>, and usable hosts = that number minus 2 (the network and broadcast addresses).</p>
<pre>/24 = 256 addresses, 254 usable   mask 255.255.255.0
/25 = 128 addresses, 126 usable   mask 255.255.255.128
/26 =  64 addresses,  62 usable   mask 255.255.255.192
/27 =  32 addresses,  30 usable   mask 255.255.255.224
/28 =  16 addresses,  14 usable   mask 255.255.255.240</pre>
<p>To find the network address, look at the block size. In a /26 the blocks start at .0, .64, .128 and .192, so <code>192.168.1.130/26</code> belongs to the block starting at <code>192.168.1.128</code>. <b>VLSM</b> (variable-length subnet masks) lets you give each subnet the size it needs instead of one size for everything. <b>Summarization</b> combines contiguous subnets into one shorter route.</p>`,
 [ty("How many usable host addresses are in a /26 network? Type the number.",["62"],"2^6 = 64 addresses, minus the network and broadcast addresses, leaves 62."),
  mc("What is the subnet mask for a /27?",["255.255.255.192","255.255.255.224","255.255.255.240","255.255.255.128"],1,"/27 leaves 5 host bits, so the last octet mask is 224."),
  mc("Which network does 192.168.1.130/25 belong to?",["192.168.1.0/25","192.168.1.128/25","192.168.1.64/25","192.168.1.192/25"],1,"A /25 splits the last octet at 128. The address 130 is in the upper half.")]));

add("nw",1,L("Name, Time and File Services","Three quiet services that break everything when they fail.",
 `<ul><li><b>DNS</b>: a <b>recursive resolver</b> does the lookups for clients and caches answers. An <b>authoritative server</b> holds the real records for a zone. <b>TTL</b> (time to live) says how long an answer may be cached, so lower it before a planned change.</li>
<li><b>DHCP reservations</b> give a device the same address every time, which is handy for printers and servers, while the rest of the range stays dynamic.</li>
<li><b>NTP</b> keeps clocks in sync. Wrong time breaks TLS certificates, Kerberos logins and log correlation.</li>
<li><b>File sharing</b>: <b>SMB</b> (Windows file shares) and <b>NFS</b> (common on Linux). Give shares the least access needed and back them up.</li>
<li>Print servers, directory services and proxies follow the same rule: document them, monitor them and have a plan for when they fail.</li></ul>`,
 [mc("A DNS record's TTL tells resolvers…",["How long they may cache the answer","How many hops to take","Which port to use","Whether to encrypt it"],0,"Short TTLs make changes spread faster."),
  mc("Why does accurate time matter on servers?",["TLS, Kerberos and log timelines depend on it","It changes the IP address","It speeds up NAT","It sets the DNS server"],0,"Clock drift causes failures that look like unrelated problems."),
  mc("A DHCP reservation does what?",["Always gives a specific device the same IP address","Blocks a device","Encrypts DHCP","Creates a VLAN"],0,"The address is tied to the device's MAC address.")]));

add("nw",1,L("Wireless Networking","Cover the clinic's three floors with Wi-Fi that does not drop during video visits.",
 `<ul><li><b>Bands</b>: 2.4 GHz travels far through walls but is slow and crowded. 5 GHz is faster with shorter range. 6 GHz (Wi-Fi 6E and newer) is faster still with the least interference.</li>
<li><b>Channels</b>: in the 2.4 GHz band, only channels 1, 6 and 11 (in North America) do not overlap, so use those.</li>
<li>Access points on the same <b>SSID</b> let devices <b>roam</b>. Plan overlapping coverage and do a <b>site survey</b> to find dead spots and interference.</li>
<li><b>Home mode</b> uses a shared passphrase (WPA3-Personal). <b>Enterprise mode</b> uses <b>802.1X</b> with a <b>RADIUS</b> server, so every person logs in with their own credentials and can be removed individually.</li>
<li>Separate SSIDs or VLANs for staff, guests and devices, and watch for rogue access points.</li></ul>`,
 [mc("Which band usually gives the best speed at short range?",["2.4 GHz","5 or 6 GHz","1 GHz","900 MHz"],1,"Higher bands carry more data but cover less distance."),
  mc("WPA3-Enterprise authenticates users using…",["One shared passphrase","802.1X with a RADIUS server","No authentication","The router's default password"],1,"Each user has individual credentials."),
  mc("In the 2.4 GHz band, which channels do not overlap?",["1, 2 and 3","1, 6 and 11","5, 6 and 7","Any three"],1,"Channels 1, 6 and 11 are spaced far enough apart.")]));

add("nw",2,L("Advanced Routing: OSPF, BGP and Anycast","The clinic grows to six sites and two internet providers. Routes need to be learned, not typed.",
 `<ul><li><b>OSPF</b> is a <b>link-state</b> protocol used inside one organization. Every router learns the full map and calculates the shortest path. Large networks are split into <b>areas</b>.</li>
<li><b>BGP</b> is a <b>path-vector</b> protocol that exchanges routes between <b>autonomous systems (AS)</b>, the independently run networks of the internet. <b>eBGP</b> runs between organizations and <b>iBGP</b> inside one. BGP follows policy (business rules), not just shortest path.</li>
<li>Bad routes can leak or be hijacked, so networks use <b>prefix filters</b> and <b>RPKI</b>, which cryptographically validates who may originate a route.</li>
<li><b>Anycast</b> advertises the same IP address from many places, and routing sends each user to the nearest one. DNS and CDNs rely on it.</li>
<li><b>Multihoming</b> (two providers) gives resilience. Combine it with health-checked failover and monitoring.</li></ul>`,
 [mc("Which protocol exchanges routes between autonomous systems on the internet?",["OSPF","BGP","DHCP","ARP"],1,"BGP is the internet's inter-domain routing protocol."),
  mc("RPKI helps prevent…",["Weak Wi-Fi passwords","Route hijacks by validating who may announce a prefix","Disk failure","Slow DNS"],1,"It lets networks reject announcements from the wrong origin."),
  mc("Anycast means…",["One IP address advertised from many locations","A secret network","Broadcast to everyone on a LAN","Encrypted routing"],0,"Users reach whichever instance is topologically nearest.")]));

add("nw",2,L("Linux Performance and Troubleshooting","The server is slow at 3 PM every day. Find the bottleneck with evidence.",
 `<p>Check the four resources in turn: <b>CPU, memory, disk, network</b>.</p>
<pre>top / htop       # live CPU and memory by process
uptime           # load average over 1, 5, 15 minutes
free -h          # memory and swap
df -h            # disk space per filesystem
df -i            # inode usage (many tiny files)
iostat / vmstat  # disk and system activity
journalctl -u nginx --since "1 hour ago"   # service logs
dmesg | grep -i oom                        # out-of-memory events</pre>
<p><b>Load average</b> counts processes running or waiting. A value well above your CPU core count means queues are forming. When memory runs out, the kernel's <b>OOM killer</b> ends processes to survive, so look for unexplained service restarts. A full disk or a full inode table stops services from writing logs and files. Fix one thing at a time and record the before and after numbers.</p>`,
 [ty("Which command shows free disk space per filesystem? Type the command (options are allowed).",["df","df -h","df -H"],"df reports disk usage. The -h flag makes sizes human readable."),
  mc("The Linux OOM killer…",["Ends processes when memory is exhausted","Cleans the disk","Blocks bad IPs","Restarts the network card"],0,"It protects the system by killing a process when memory runs out."),
  mc("Which command reads logs for a systemd service?",["journalctl","chmod","traceroute","ssh-keygen"],0,"journalctl queries the systemd journal.")]));

add("nw",2,L("Cloud and Kubernetes Networking","The clinic moves its apps into the cloud and onto Kubernetes.",
 `<ul><li>A <b>VPC</b> is your private cloud network, split into <b>subnets</b>. A <b>NAT gateway</b> lets private subnets reach the internet outbound without being reachable inbound. <b>Peering</b> or a <b>transit gateway</b> connects VPCs and on-premises networks.</li>
<li><b>Security groups</b> are stateful firewalls attached to resources. <b>Network ACLs</b> are stateless rules on subnets, so you must allow return traffic explicitly.</li>
<li><b>Load balancers</b> spread traffic across instances in multiple availability zones for resilience.</li>
<li><b>Kubernetes</b>: every pod gets its own IP. A <b>Service</b> gives a set of pods one stable address and DNS name. An <b>Ingress</b> routes external HTTP(S) traffic to Services. <b>NetworkPolicies</b> restrict which pods may talk to which, and the cluster's <b>CNI</b> plugin provides the pod network.</li>
<li>A <b>service mesh</b> adds mutual TLS, retries and observability between services.</li></ul>`,
 [mc("A cloud NAT gateway is used so that…",["Private subnets can reach the internet outbound without being reachable inbound","Public sites can host DNS","Disks are encrypted","Users can SSH faster"],0,"It provides outbound-only internet access."),
  mc("Security groups are…",["Stateful, so return traffic is allowed automatically","Stateless and need return rules","Only for DNS","The same as VLANs"],0,"Network ACLs are the stateless layer."),
  mc("A Kubernetes Service provides…",["A stable address and name for a set of pods","A new node","A container image","A password"],0,"Pods come and go, and the Service stays constant.")]));
