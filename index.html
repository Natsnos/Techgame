<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Skillforge</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: HUD-style game shell over a live canvas backdrop. Track select -> tiered level map -> lesson -> challenge -> exam. Deliberately single-theme (dark). */
:root{
  --bg:#0a0f1e; --panel:#121a30; --panel2:#18223d; --line:#2a3858;
  --fg:#e8ecf7; --mute:#97a4c4; --acc:#7f9cff;
  --ok:#4fd1a1; --bad:#ff7d7d;
  --display:"Chakra Petch","Trebuchet MS",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{
  background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 48px;min-height:100vh;
}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:.5;pointer-events:none}
.shell{position:relative;z-index:1;max-width:1040px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
code{font-family:var(--mono);font-size:.88em;background:rgba(127,156,255,.14);padding:.1em .4em;border-radius:3px}
pre{font-family:var(--mono);font-size:.88rem;background:#070b17;border:1px solid var(--line);border-left:3px solid var(--acc);padding:12px 14px;overflow-x:auto;margin:12px 0;line-height:1.55}
pre code{background:none;padding:0}
.cham{clip-path:polygon(0 12px,12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%)}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;font-family:var(--display);font-weight:700;font-size:1.25rem;letter-spacing:.04em}
.brand svg{width:26px;height:26px;color:var(--acc)}
#chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:.78rem;padding:4px 10px;border:1px solid var(--line);background:rgba(18,26,48,.85);color:var(--mute)}
.chip b{color:var(--fg)}
.chip.rank{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 50%,var(--line))}

/* type */
h1,h2,h3{font-family:var(--display);line-height:1.12;margin:0;text-wrap:balance}
h1{font-size:clamp(2.3rem,6.5vw,4.2rem);font-weight:700;letter-spacing:-.01em}
h2{font-size:1.5rem;font-weight:600}
.eyebrow,.label{font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin:0}
.lead{font-size:1.1rem;color:var(--mute);max-width:56ch;margin:18px 0 0}
.link{background:none;border:0;padding:0;color:var(--mute);text-decoration:underline;text-underline-offset:3px;font-size:.9rem}
.link:hover{color:var(--fg)}

/* buttons */
.btn{background:var(--acc);color:#0a0f1e;border:0;padding:11px 22px;font-family:var(--display);font-weight:700;font-size:1rem;letter-spacing:.03em;clip-path:polygon(0 8px,8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%)}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:var(--line);color:var(--fg)}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}

/* home */
.hero{padding:34px 0 30px}
.tracks{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.card{position:relative;text-align:left;border:0;padding:22px 22px 20px;background:linear-gradient(160deg,var(--panel2),var(--panel));display:flex;flex-direction:column;gap:10px;min-width:0;box-shadow:inset 0 2px 0 var(--acc)}
.card:hover{background:linear-gradient(160deg,color-mix(in srgb,var(--acc) 16%,var(--panel2)),var(--panel))}
.card p{margin:0;color:var(--mute);font-size:.95rem}
.ic{width:44px;height:44px;color:var(--acc);display:block}
.ic svg{width:100%;height:100%}
.ic.big{width:54px;height:54px;flex:none}
.bar{height:6px;background:var(--line);margin-top:6px}
.bar i{display:block;height:100%;background:var(--acc)}
.meta{font-family:var(--mono);font-size:.76rem;color:var(--mute)}
.path{list-style:none;margin:30px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;counter-reset:s}
.path li{border-top:2px solid var(--line);padding-top:10px;color:var(--mute);font-size:.92rem}
.path b{display:block;font-family:var(--display);color:var(--fg);font-size:1.05rem}

/* map */
.crumbs{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0 14px;font-size:.9rem;color:var(--mute)}
.mhead{display:flex;gap:16px;align-items:center;margin-bottom:22px}
.mhead p{margin:6px 0 0;color:var(--mute);max-width:54ch}
.zone{background:rgba(18,26,48,.8);border:1px solid var(--line);padding:20px;margin-bottom:18px}
.zone.locked{opacity:.62}
.zhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.zstat{font-family:var(--mono);font-size:.78rem;color:var(--mute)}
.lockmsg{display:flex;gap:8px;align-items:center;margin:0 0 12px;color:var(--mute);font-size:.9rem}
.lockmsg svg{width:16px;height:16px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{border:0;padding:1px;background:var(--line);text-align:left;min-width:0}
.tile .in{display:flex;flex-direction:column;gap:6px;height:100%;min-height:116px;padding:12px;background:var(--panel);clip-path:polygon(0 11px,11px 0,100% 0,100% calc(100% - 11px),calc(100% - 11px) 100%,0 100%)}
.tile.open{background:var(--acc)}
.tile.open:hover .in,.tile.done:hover .in{background:var(--panel2)}
.tile.done{background:color-mix(in srgb,var(--acc) 55%,var(--line))}
.tile.exam{grid-column:span 2}
.num{font-family:var(--mono);font-size:.74rem;color:var(--acc)}
.tile.lock .num{color:var(--mute)}
.tt{font-family:var(--display);font-weight:600;font-size:1rem;line-height:1.2;overflow-wrap:anywhere}
.tile.lock .tt{color:var(--mute)}
.stars{display:flex;gap:3px;margin-top:auto;align-items:center}
.st{width:15px;height:15px;fill:var(--line)}
.st.on{fill:var(--acc)}
.stars svg.lk{width:15px;height:15px;color:var(--mute);fill:none}

/* lesson */
.brief{border-left:3px solid var(--acc);background:rgba(18,26,48,.85);padding:14px 18px;margin-bottom:16px}
.brief p{margin:4px 0 0}
.lesson{background:rgba(18,26,48,.88);border:1px solid var(--line);padding:24px;max-width:78ch}
.lesson h1{font-size:clamp(1.7rem,4.5vw,2.4rem);margin:6px 0 12px}
.lesson p,.lesson li{color:#d3daee}
.lesson ul{padding-left:1.2em}

/* quiz */
.qwrap{max-width:760px}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.dots{display:flex;gap:5px}
.dots i{width:22px;height:6px;background:var(--line)}
.dots i.on{background:var(--acc)}
.qcard{background:rgba(18,26,48,.9);border:1px solid var(--line);padding:22px}
.qtext{font-size:1.15rem;margin:0 0 16px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--panel2);border:1px solid var(--line);padding:12px 14px}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt .k{font-family:var(--mono);font-size:.78rem;color:var(--acc);border:1px solid var(--line);min-width:22px;height:22px;display:grid;place-items:center;flex:none;margin-top:2px}
.opt.good{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--panel2))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--panel2))}
.opt:disabled{cursor:default}
.term{display:flex;align-items:center;gap:10px;background:#070b17;border:1px solid var(--line);padding:8px 10px;flex-wrap:wrap}
.term .ps{font-family:var(--mono);color:var(--acc)}
.term input{flex:1;min-width:140px;background:none;border:0;color:var(--fg);font-family:var(--mono);font-size:1rem;padding:8px 4px}
.term input:focus{outline:none}
.term:focus-within{border-color:var(--acc)}
.term .btn{padding:8px 16px}
.fb{margin-top:16px;padding:14px 16px;border:1px solid var(--line);background:var(--panel)}
.fb.ok{border-color:var(--ok)}
.fb.no{border-color:var(--bad)}
.fb strong{font-family:var(--display);font-size:1.1rem}
.fb.ok strong{color:var(--ok)}
.fb.no strong{color:var(--bad)}
.fb p{margin:6px 0 12px;color:#d3daee}

/* results */
.res{max-width:760px;background:rgba(18,26,48,.9);border:1px solid var(--line);padding:26px}
.res .stars{margin:12px 0}
.res .st{width:30px;height:30px}
.score{font-family:var(--display);font-size:3rem;font-weight:700;line-height:1;color:var(--acc)}
.review{margin:16px 0 0;padding:0;list-style:none;display:grid;gap:10px}
.review li{border-left:3px solid var(--bad);padding:6px 12px;background:var(--panel);font-size:.92rem}
.mastered{margin-top:18px;border:1px solid var(--acc);padding:14px 16px;background:color-mix(in srgb,var(--acc) 12%,var(--panel))}

.foot{margin-top:36px;color:var(--mute);font-size:.82rem;display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:space-between}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--panel2);border:1px solid var(--acc);padding:10px 16px;opacity:0;transition:opacity .2s,transform .2s;z-index:5;max-width:calc(100% - 32px);pointer-events:none;font-size:.92rem}
#toast.show{opacity:1;transform:translate(-50%,0)}
.charwrap{display:grid;grid-template-columns:minmax(0,280px) minmax(0,1fr);gap:28px;align-items:start}
.prevcard{background:var(--panel);border:1px solid var(--line);padding:10px;position:sticky;top:12px}
.prevcard canvas{display:block;width:100%;height:auto;aspect-ratio:260/300}
.chform h3{margin:20px 0 8px;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-family:var(--mono);font-weight:500}
.namein{background:var(--panel);border:1px solid var(--line);color:var(--fg);padding:12px 14px;font:inherit;font-size:1.1rem;width:100%;max-width:360px;display:block;margin-top:6px}
.namein:focus{outline:2px solid var(--acc);outline-offset:1px}
.sws{display:flex;gap:8px;flex-wrap:wrap}
.swb{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);padding:0;cursor:pointer}
.swb.on{border-color:#fff;box-shadow:0 0 0 2px var(--acc)}
.chip.on{border-color:var(--acc);color:var(--acc)}
.townbtn{margin-left:auto;margin-right:8px;cursor:pointer;color:var(--fg)}
body[data-town="1"] .townbtn,body[data-town="1"] .foot{display:none}
.hud{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;line-height:1}
.hud>*{pointer-events:auto}
.hud .chip{background:rgba(8,12,26,.78);cursor:pointer;color:var(--fg)}
.touch-ui{position:absolute;left:10px;right:10px;bottom:10px;display:none;justify-content:space-between;align-items:flex-end;pointer-events:none;line-height:1}
.touch-ui>*{pointer-events:auto}
.touch-ui .pad{opacity:.7}
#enterBtn:disabled{visibility:hidden}
@media (max-width:760px){.charwrap{grid-template-columns:minmax(0,1fr)}.prevcard{position:static;max-width:280px}}
.town-wrap{position:relative;background:#0b1224;border:1px solid var(--line);line-height:0;margin-bottom:12px}
#town{display:block;width:100%;touch-action:manipulation;cursor:pointer}
#town:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
.town-ui{display:grid;gap:10px;margin-bottom:6px}
.town-ui .meta{margin:0}
.town-ctl{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.pad{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(2,44px);gap:4px;grid-template-areas:". up ." "left down right"}
.pad button{background:var(--panel2);border:1px solid var(--line);color:var(--fg);font-size:1.1rem;touch-action:none;user-select:none;-webkit-user-select:none}
.pad button:active{border-color:var(--acc);background:var(--line)}
.pad [data-dir=up]{grid-area:up}.pad [data-dir=left]{grid-area:left}.pad [data-dir=down]{grid-area:down}.pad [data-dir=right]{grid-area:right}
@media (pointer:coarse),(max-width:700px){.touch-ui{display:flex}}
.btn:disabled{opacity:.45;cursor:default;filter:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mtabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
.mtabs .chip{cursor:pointer;color:var(--fg)}

.story{margin:6px 0 14px;padding:10px 14px;border-left:3px solid var(--acc);background:rgba(24,34,61,.7);color:#d3daee;font-size:.95rem}
.story b{font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--acc);margin-right:8px}
.daily{display:grid;grid-template-columns:1fr auto;gap:8px 14px;align-items:center;margin-top:16px;padding:12px 14px;background:var(--panel);border:1px solid var(--line)}
.daily div:first-child{display:flex;flex-direction:column}.daily span{color:var(--mute);font-size:.9rem}
.daily .bar{grid-column:1/3;height:8px;background:var(--panel2);overflow:hidden}.daily .bar i{display:block;height:100%;background:var(--ok)}
.quests{grid-column:1/3;list-style:none;margin:4px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:4px;font-size:.88rem;color:var(--mute)}.quests li.on{color:var(--ok)}
.daily em{font-style:normal;font-family:var(--mono)}
.peek{margin:10px 0 12px;border:1px solid var(--line);background:var(--panel2)}.peek summary{cursor:pointer;padding:9px 12px;color:var(--acc)}
.peekbody{padding:4px 14px 12px;max-height:320px;overflow:auto;font-size:.92rem}
.mail{padding:14px;background:var(--panel2);border:1px solid var(--line);font-family:var(--mono);font-size:.88rem;line-height:1.7;overflow-wrap:anywhere}
.codeblk{display:flex;flex-direction:column;gap:4px;margin-top:12px}
.cl{display:flex;gap:12px;text-align:left;background:var(--panel2);border:1px solid var(--line);padding:8px 12px;color:var(--fg);cursor:pointer;min-width:0}
.cl code{white-space:pre-wrap;overflow-wrap:anywhere}.cl .ln{color:var(--mute);font-family:var(--mono)}
.cl.good{border-color:var(--ok)}.cl.bad{border-color:var(--bad)}
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.shopcard{display:flex;flex-direction:column;gap:6px;align-items:flex-start;padding:10px;background:var(--panel);border:1px solid var(--line);min-width:0}
.shopprev{width:100px;height:130px;max-width:100%;border:1px solid var(--line);align-self:center}
.shopcard .btn{padding:8px 12px;font-size:.85rem}
.goldn{color:#f2b544}.chip.gold b{color:#f2b544}
.hud{flex-wrap:wrap}.hudr{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.hud .chip{padding:6px 9px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--panel);border:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat b{font-family:var(--display);font-size:1.5rem;overflow-wrap:anywhere}.stat span{color:var(--mute);font-size:.8rem}
.sech{margin:28px 0 10px;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-family:var(--mono);font-weight:500}
.subj{display:grid;gap:10px}.subrow{display:grid;grid-template-columns:minmax(0,170px) 1fr 56px;gap:12px;align-items:center}
.subrow .bar{margin:0}.subrow .meta{text-align:right}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.badge{border:1px solid var(--line);background:var(--panel);padding:12px;display:flex;flex-direction:column;gap:4px;opacity:.55;min-width:0}
.badge b{font-family:var(--display)}.badge span{font-size:.82rem;color:var(--mute)}.badge em{font-size:.74rem;color:var(--acc);font-style:normal}
.badge.on{opacity:1;border-color:var(--acc);box-shadow:inset 0 2px 0 var(--acc)}
.upg{list-style:none;margin:0;padding:0;display:grid;gap:8px}.upg li{padding:10px 12px;background:var(--panel);border:1px solid var(--line);color:var(--mute)}.upg li.on{color:var(--fg);border-color:var(--acc)}
.setlist{display:grid;gap:8px;max-width:620px}
.setrow{display:flex;justify-content:space-between;gap:12px;align-items:center;text-align:left;background:var(--panel);border:1px solid var(--line);color:var(--fg);padding:14px 16px;font:inherit;cursor:pointer}
.setrow:hover{border-color:var(--acc)}.setrow b{color:var(--acc);font-family:var(--mono);font-weight:500}
.codebox{width:100%;max-width:620px;background:var(--panel);border:1px solid var(--line);color:var(--fg);font-family:var(--mono);font-size:.78rem;padding:10px;display:block;margin:8px 0;word-break:break-all}
.howto{margin:0;padding-left:20px;display:grid;gap:8px;max-width:680px;color:var(--mute)}
.chip.lock{opacity:.5}
html.hc{--line:#7384b0;--mute:#d3dbef;--fg:#fff;--panel:#0b1224;--panel2:#121b34}
.joy{position:relative;width:124px;height:124px;border-radius:50%;background:rgba(8,12,26,.55);border:2px solid rgba(127,156,255,.55);touch-action:none;opacity:.85}
.joy i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(127,156,255,.8);border:2px solid rgba(255,255,255,.25)}
.town-opts{display:flex;gap:8px;flex-wrap:wrap}
.town-opts .chip,.chips .chip,button.chip{cursor:pointer;color:var(--fg);font-family:var(--mono)}
button.chip:hover{border-color:var(--acc)}
.mbanner{display:block;width:100%;height:100px;margin:0 0 16px;border:1px solid var(--line);border-bottom:0;position:relative;z-index:0}
.mhead{position:relative;z-index:1}
.pmap{position:relative;display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));grid-auto-rows:136px;margin:6px 0 4px}
.ppath{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.pbase{fill:none;stroke:var(--line);stroke-width:4;stroke-dasharray:2 9;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.pdone{fill:none;stroke:var(--acc);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;filter:drop-shadow(0 0 4px var(--acc))}
.pn{position:relative;z-index:1;background:none;border:0;padding:4px 4px 0;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--fg);min-width:0;cursor:pointer;font:inherit}
.pn .disc{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--panel);border:3px solid var(--line);font-family:var(--display);font-weight:700;font-size:1.15rem;transition:transform .15s}
.pn .disc svg{width:20px;height:20px}
.pn.open .disc{border-color:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 22%,transparent),0 0 18px color-mix(in srgb,var(--acc) 45%,transparent);animation:pnpulse 2.2s ease-in-out infinite}
.pn.done .disc{background:var(--acc);border-color:var(--acc);color:#0a0f1e}
.pn.lock{cursor:default;opacity:.72}
.pn.lock .disc{color:var(--mute)}
.pn.lab .disc{border-radius:16px;font-size:.72rem;letter-spacing:.05em}
.pn.boss .disc{width:70px;height:70px;border-radius:0;clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%);border:0;background:var(--line);font-size:.78rem;letter-spacing:.06em;box-shadow:none;animation:none}
.pn.boss.open .disc{background:var(--acc);color:#0a0f1e}
.pn.boss.done .disc{background:var(--acc);color:#0a0f1e}
.pn:hover:not(.lock) .disc{transform:scale(1.08)}
.pn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.pn .pt{font-size:.76rem;line-height:1.25;text-align:center;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:100%}
.pn .pt small{color:var(--mute)}
